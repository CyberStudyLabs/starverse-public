/* ---------- spinning-dial engine (shared) ---------- */
let _ac=null;function tick(f=1800,d=.03,v=.06){try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v,_ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+d);o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+d);}catch(e){}try{navigator.vibrate&&navigator.vibrate(4);}catch(e){}}
function chime(){[660,880,1320].forEach((f,i)=>setTimeout(()=>tick(f,.18,.05),i*90));}
const polar=(cx,cy,r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
function seg(cx,cy,r1,r2,a0,a1){const [x1,y1]=polar(cx,cy,r2,a0),[x2,y2]=polar(cx,cy,r2,a1),[x3,y3]=polar(cx,cy,r1,a1),[x4,y4]=polar(cx,cy,r1,a0);return`M${x1.toFixed(1)} ${y1.toFixed(1)} A${r2} ${r2} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} A${r1} ${r1} 0 0 0 ${x4.toFixed(1)} ${y4.toFixed(1)}Z`;}
function teeth(cx,cy,r,n,col){let s='';for(let k=0;k<n;k++){const a=k*360/n,[x1,y1]=polar(cx,cy,r,a-2.2),[x2,y2]=polar(cx,cy,r+7,a-1),[x3,y3]=polar(cx,cy,r+7,a+1),[x4,y4]=polar(cx,cy,r,a+2.2);s+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} L${x4.toFixed(1)} ${y4.toFixed(1)}Z" fill="${col}"/>`;}return s;}
/* rings: [{r1,r2,n,g:<g> element,onSnap(index)}]; rotation in degrees, snapped to 360/n */
function spinRings(svg,cx,cy,rings){
  rings.forEach(R=>{R.a=R.a||0;R.v=0;R.drag=false;R.lastIdx=null;});
  const toSvg=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const m=svg.getScreenCTM();if(!m)return[cx,cy];const q=pt.matrixTransform(m.inverse());return[q.x,q.y];};
  const angOf=(x,y)=>Math.atan2(y-cy,x-cx)*180/Math.PI;
  let act=null,lastA=0,lastT=0;
  svg.addEventListener('pointerdown',e=>{const [x,y]=toSvg(e),d=Math.hypot(x-cx,y-cy);act=rings.find(R=>d>=R.r1-6&&d<=R.r2+10&&!R.locked);if(!act)return;e.preventDefault();try{svg.setPointerCapture(e.pointerId);}catch(_){}
    act.drag=true;act.v=0;lastA=angOf(x,y);lastT=performance.now();});
  svg.addEventListener('pointermove',e=>{if(!act)return;const [x,y]=toSvg(e);let a=angOf(x,y),d=a-lastA;if(d>180)d-=360;if(d<-180)d+=360;act.a+=d;const now=performance.now();act.v=d/Math.max(8,now-lastT)*16;lastA=a;lastT=now;});
  const up=()=>{if(act){act.drag=false;act=null;}};svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  const idxOf=R=>{const step=360/R.n;return((Math.round(-R.a/step)%R.n)+R.n)%R.n;};
  let started=false;
  (function frame(){if(!svg.isConnected){if(started)return;requestAnimationFrame(frame);return;}started=true;
    rings.forEach(R=>{const step=360/R.n;
      if(!R.drag){if(Math.abs(R.v)>.6){R.a+=R.v;R.v*=.93;}else{const t=Math.round(R.a/step)*step;R.v=(R.v+(t-R.a)*.18)*.72;R.a+=R.v;if(Math.abs(t-R.a)<.05&&Math.abs(R.v)<.05){R.a=t;R.v=0;}}}
      R.g.setAttribute('transform',`rotate(${R.a.toFixed(2)} ${cx} ${cy})`);
      const i=idxOf(R);if(i!==R.lastIdx){if(R.lastIdx!==null)tick(R.n>6?2200:1600);R.lastIdx=i;R.onSnap&&R.onSnap(i);}});
    requestAnimationFrame(frame);})();
  return{idxOf,nudge(R,dir){R.v=0;R.a+=dir*-(360/R.n)*.35;R.v=dir*-(360/R.n)*.12;}};}

/* ---------- Word Wheel (compound words, Gr 2) ---------- */
GAMES.compound=function(stage,level,api){
  const lv=level==null?rnd(0,4):level;
  const pick6=()=>{const out=[],fs=new Set(),ss=new Set();for(const c of deal('wheel',COMP,12)){if(out.length<6&&!fs.has(c[0])&&!ss.has(c[1])){out.push(c);fs.add(c[0]);ss.add(c[1]);}}while(out.length<6){const c=pick(COMP);if(!fs.has(c[0])&&!ss.has(c[1])){out.push(c);fs.add(c[0]);ss.add(c[1]);}}return out;};
  const pairs=pick6(),inner=shuffle(pairs.map(p=>p[0])),outer=shuffle(pairs.map(p=>p[1]));
  const COLS=['#FF5ACD','#FFD93D','#22D3EE','#7CFBB2','#FF8A3D','#A78BFA'];const done={};let crashed=0,locked=false;
  const CX=260,CY=262,N=6,ST=60,A0=0;
  stage.innerHTML='';api.prog(0,1);
  const w=h(`<div><div class="paper xban"><div><div class="xb1">Spin the wheels. Line up two words that make a new word!</div><div class="xb2">Only the words in the gold window count. Read them left to right.</div></div><button class="speak">🔊</button></div>
    <svg class="wheel2" viewBox="0 0 520 524"><defs><radialGradient id="whub" cx="40%" cy="35%"><stop offset="0" stop-color="#4a57a8"/><stop offset="1" stop-color="#1C2444"/></radialGradient><filter id="wgl"><feGaussianBlur stdDeviation="5"/></filter></defs>
      <g class="ro"></g><g class="ri"></g>
      <circle cx="${CX}" cy="${CY}" r="62" fill="url(#whub)" stroke="#5b6390" stroke-width="5"/><text class="hubt" x="${CX}" y="${CY+12}" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="34" fill="#FFD93D">?</text>
      <g class="lockz" pointer-events="none"><rect x="${CX+62}" y="${CY-50}" width="194" height="100" rx="18" fill="none" stroke="#FFD93D" stroke-width="5"/><text x="${CX+160}" y="${CY-60}" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="13" fill="#FFD93D">READ THIS WAY →</text></g></svg>
    <div class="wpane"><span class="wa"></span><span class="wplus">+</span><span class="wb"></span><span class="weq">= ?</span></div>
    <div class="row"><button class="btn ghost sm" data-r="i" data-d="-1">◀ inner</button><button class="btn ghost sm" data-r="i" data-d="1">inner ▶</button><button class="btn gold big crash" style="width:auto;padding:14px 34px">💥 CRASH!</button><button class="btn ghost sm" data-r="o" data-d="-1">◀ outer</button><button class="btn ghost sm" data-r="o" data-d="1">outer ▶</button></div></div>`);
  const svg=w.querySelector('svg'),ri=w.querySelector('.ri'),ro=w.querySelector('.ro'),wa=w.querySelector('.wa'),wb=w.querySelector('.wb'),weq=w.querySelector('.weq'),hub=w.querySelector('.hubt');
  const color=word=>{const k=Object.keys(done).find(p=>p.split('+').includes(word));return k?done[k]:null;};
  function drawRings(){let si='',so=teeth(CX,CY,250,40,'#3a4a8c');
    const OT=['#2D3768','#3b4a8e','#2a3f7a','#394b9a','#263a70','#34468a'],IT=['#EEF0FF','#DCE2FF','#F5F8FF','#D6DCFA','#EAEEFF','#DEE4FF'];
    outer.forEach((wd,j)=>{const c=A0+j*ST,col=color(wd);so+=`<path d="${seg(CX,CY,176,248,c-ST/2+1.5,c+ST/2-1.5)}" fill="${col||OT[j]}" stroke="#0B1026" stroke-width="3"/><circle cx="${polar(CX,CY,240,c-23)[0].toFixed(1)}" cy="${polar(CX,CY,240,c-23)[1].toFixed(1)}" r="4" fill="#B7BEE6"/>`;const [x,y]=polar(CX,CY,212,c);so+=`<g class="lbl" data-x="${x}" data-y="${y}"><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="Nunito" font-weight="800" font-size="21" fill="${col?'#0B1026':'#F5F8FF'}">${wd}</text></g>`;});
    si+=teeth(CX,CY,166,32,'#B7BEE6');
    inner.forEach((wd,i)=>{const c=A0+i*ST,col=color(wd);si+=`<path d="${seg(CX,CY,66,166,c-ST/2+1.5,c+ST/2-1.5)}" fill="${col||IT[i]}" stroke="#0B1026" stroke-width="3"/><circle cx="${polar(CX,CY,156,c-23)[0].toFixed(1)}" cy="${polar(CX,CY,156,c-23)[1].toFixed(1)}" r="4" fill="#6832F6"/>`;const [x,y]=polar(CX,CY,118,c);si+=`<g class="lbl" data-x="${x}" data-y="${y}"><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="Nunito" font-weight="800" font-size="22" fill="#0B1026">${wd}</text></g>`;});
    ro.innerHTML=so;ri.innerHTML=si;}
  drawRings();
  const RI={r1:66,r2:166,n:N,g:ri},RO={r1:176,r2:250,n:N,g:ro};
  // keep labels upright while rings rotate
  const upright=()=>{[RI,RO].forEach(R=>R.g.querySelectorAll('.lbl').forEach(l=>l.setAttribute('transform',`rotate(${-R.a} ${l.dataset.x} ${l.dataset.y})`)));requestAnimationFrame(upright);};
  const sp=spinRings(svg,CX,CY,[RI,RO]);upright();
  const cur=()=>[inner[sp.idxOf(RI)],outer[sp.idxOf(RO)]];
  RI.onSnap=RO.onSnap=()=>{const [a,b]=cur();wa.textContent=a||'';wb.textContent=b||'';weq.textContent='= ?';};
  setTimeout(()=>{const [a,b]=cur();wa.textContent=a;wb.textContent=b;},50);
  w.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const R=b.dataset.r==='i'?RI:RO;R.a+=(+b.dataset.d)*-ST;});

  w.querySelector('.crash').onclick=()=>{if(locked)return;const [a,b]=cur(),key=a+'+'+b;
    if(color(a)||color(b)){api.coach('One of those words is already crashed! Spin to a new pair.','info');return;}

    if(ok){const em=pairs.find(p=>p[0]===a)[2];done[key]=COLS[crashed%COLS.length];crashed++;drawRings();weq.textContent=`= ${a+b} ${em}`;chime();burstAt(w.querySelector('.wpane'));
      api.coach(`Crash! ${a} + ${b} = ${a+b}!`,'good');if(crashed<N)setAns();
      if(crashed===N){locked=true;hub.textContent='🌟';api.later(()=>{const ov=h(`<div class="overlay"><div class="modal"><div style="font-size:60px">🎡</div><h2>Wheel complete!</h2><p>${pairs.map(p=>p[0]+p[1]).join(' · ')}</p><div class="row"><button class="btn gold">Continue</button></div></div></div>`);ov.querySelector('button').onclick=()=>{ov.remove();api.finish();};document.body.append(ov);kidSay('Wheel complete!');},1300);}}
    else{tick(220,.15,.08);const pn=w.querySelector('.wpane');pn.classList.remove('shake');void pn.offsetWidth;pn.classList.add('shake');
      const real=COMP.some(p=>p[0]===a&&p[1]===b)||COMP_X.has(a+b);

      else api.coach(pairs.some(p=>p[0]===b&&p[1]===a)?'Right words, wrong order! Which word comes first?':`Say it out loud: “${a}${b}.” That isn’t a word we use. Try spinning a wheel.`);}};
  function setAns(){const p=pairs.find(q=>!done[q[0]+'+'+q[1]]);if(!p){api.answer(null);return;}
    api.answer(`Try “${p[0]}” + “${p[1]}” = ${p[0]+p[1]} ${p[2]}. Spin the wheels to line them up, then crash!`,
      ()=>{RI.a=-inner.indexOf(p[0])*ST;RO.a=-outer.indexOf(p[1])*ST;RI.v=RO.v=0;setTimeout(()=>{if(!locked)w.querySelector('.crash').click();},900);});}
  setAns();
  stage.append(w);kidSay('Spin the wheels. Line up two words that make a new word!');
};

/* ---------- Safe Cracker (Word Forge, Gr 5) ---------- */
GAMES.forge=function(stage,level,api){
  const pool=level==null?FORGE:FORGE.filter(f=>level<=2?f.p.length===2:f.p.length===3);
  const items=deal('fg'+pool.length,pool,3);let i=0;
  const hl=level==null||level<=2,COLS=['#FF5ACD','#FFD93D','#22D3EE'];
  const stem=s=>s.toLowerCase().replace(/[^a-z ]/g,'').split(' ').filter(x=>x.length>2).map(x=>x.slice(0,4));
  function chunkMap(f){const chunks=[...f.m.matchAll(/\*([^*]+)\*/g)].map(m=>m[1]),used=new Set();return chunks.map(c=>{let best=0,bs=-1;f.p.forEach((p,k)=>{if(used.has(k))return;const a=stem(c),b=stem(MEAN[p]+' '+p);const sc=a.filter(x=>b.some(y=>y===x||x.startsWith(y)||y.startsWith(x))).length;if(sc>bs){bs=sc;best=k;}});used.add(best);return[c,best];});}
  const posParts=k=>[...new Set(FORGE.filter(f=>f.p[k]).map(f=>f.p[k]))];
  function show(){const it=items[i],n=it.p.length;let locked=false;api.prog(i,items.length);api.clear();stage.innerHTML='';
    const cm=chunkMap(it);let m=it.m;cm.forEach(([c,k])=>{m=m.replace('*'+c+'*',hl?`<span class="hl" style="background:${COLS[k]}">${c}</span>`:c);});
    const CX=260,CY=260,radii=n===3?[[178,232],[118,172],[62,112]]:[[150,222],[66,144]];
    const rings=it.p.map((p,k)=>{const others=shuffle(posParts(k).filter(x=>x!==p)).slice(0,7);while(others.length<7)others.push(pick(ALLPARTS.filter(x=>x!==p&&!others.includes(x))));const opts=shuffle([p,...others]);return{opts,ans:p,r1:radii[k][0],r2:radii[k][1],n:8};});
    const w=h(`<div><div class="paper xban"><div><div class="xb1">Spin the dials to build a word that means:</div><div class="safem">“${m}”</div></div></div>
      <div class="safewrap"><svg class="safe2" viewBox="0 0 520 520"><defs><radialGradient id="sdoor" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#5b6390"/><stop offset="1" stop-color="#2D3768"/></radialGradient><radialGradient id="shub" cx="40%" cy="35%"><stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#C99A00"/></radialGradient></defs>
        <rect x="6" y="6" width="508" height="508" rx="40" fill="#0B1026" stroke="#5b6390" stroke-width="6"/><g class="loot"><text x="260" y="250" text-anchor="middle" font-size="90">💎</text><text x="260" y="330" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="40" fill="#FFD93D" class="lootw"></text></g>
        <g class="sdoorg"><rect x="6" y="6" width="508" height="508" rx="40" fill="url(#sdoor)" stroke="#8891b8" stroke-width="6"/>${rings.map((_,k)=>`<g class="rg rg${k}"></g>`).join('')}
        <circle cx="${CX}" cy="${CY}" r="${n===3?54:58}" fill="url(#shub)" stroke="#fff" stroke-width="4"/><circle class="knob" cx="${CX}" cy="${CY}" r="16" fill="#5a4300"/>
        <rect x="${CX-40}" y="${CY-(n===3?240:230)}" width="80" height="${n===3?190:180}" rx="16" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="8 6"/><path d="M${CX-16} ${CY-(n===3?262:252)} L${CX+16} ${CY-(n===3?262:252)} L${CX} ${CY-(n===3?242:232)}Z" fill="#fff"/></g></svg>
        <div class="tumb">${it.p.map((_,k)=>`<div class="tb" style="border-color:${COLS[k]}"><span style="color:${COLS[k]}">${['1ST','2ND','3RD'][k]} PART</span><b class="tbs">?</b></div>`).join('')}<button class="btn gold big open">🔓 OPEN</button></div></div>
      <div class="wpane safep"></div></div>`);
    const svg=w.querySelector('svg'),pane=w.querySelector('.safep'),tbs=w.querySelectorAll('.tbs');
    rings.forEach((R,k)=>{R.g=w.querySelector('.rg'+k);let s=teeth(CX,CY,R.r2,48,'#1C2444');
      R.opts.forEach((o,j)=>{const c=-90+j*45;s+=`<path d="${seg(CX,CY,R.r1,R.r2,c-21.5,c+21.5)}" fill="${hl?['#5c2a54','#5c5228','#1f4f5c'][k]:'#2D3768'}" stroke="#0B1026" stroke-width="2.5"/>`;const [x,y]=polar(CX,CY,(R.r1+R.r2)/2,c);s+=`<g class="lbl" data-x="${x}" data-y="${y}"><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-family="Nunito" font-weight="800" font-size="${k===n-1&&n===3?14:16}" fill="#F5F8FF">${o}</text></g>`;});

          api.coach(`Cracked it! ${it.p.join('')} = ${it.p.map(x=>`${x} (${MEAN[x]})`).join(' + ')}`,'good');burstAt(svg);api.later(()=>{i++;i<items.length?show():api.finish();},2800);}
        else api.coach(`The ${['1st','2nd','3rd'][bad]} dial needs a part that means “${MEAN[it.p[bad]]}.” Which part means that?`);},n*280+100);};

      ()=>{rings.forEach(R=>{R.a=-R.opts.indexOf(R.ans)*45;R.v=0;});setTimeout(()=>{if(!locked)w.querySelector('.open').click();},900);});
    stage.append(w);}

    <div class="ednotes"></div><div class="paper draft"><div class="dtitle"></div><div class="strips"></div></div>
    <div class="row"><button class="btn ghost sm hintb" ${showNotes?'hidden':''}>💡 Need a hint?</button><button class="btn gold big send" style="width:auto" disabled>📖 Send to the class book</button></div></div>`);
  w.querySelector('.dtitle').textContent=D.t;
  const notesEl=w.querySelector('.ednotes'),strips=w.querySelector('.strips'),send=w.querySelector('.send');
  function paintNotes(){const shown=fixes.filter((f,k)=>showNotes||hintsShown.has(k)||f.ok);
    notesEl.innerHTML=`<div class="ntitle">📌 EDITOR’S NOTES ${showNotes?'':`<span class="muted">(${fixes.filter(f=>f.ok).length} of ${fixes.length} fixed)</span>`}</div>`+(shown.length?shown.map(f=>`<div class="nrow ${f.ok?'ok':''}">${f.ok?'✓':'○'} ${f.note}</div>`).join(''):`<div class="nrow muted">Find ${fixes.length} problems. Read carefully!</div>`);
    send.disabled=!fixes.every(f=>f.ok);if(!send.disabled)send.classList.add('pulse');}
  const fixDone=(pred,msg)=>{const f=fixes.find(pred);if(f&&!f.ok){f.ok=true;tick(1500,.05,.07);api.coach(msg,'good');paintNotes();setAns();}};
  function setAns(){const f=fixes.find(q=>!q.ok);if(!f){api.answer(null);return;}let txt,fn;
    if(f.k==='tok'){const x=byId(f.sid);txt=`In sentence ${x.num}, “${x.tok.wrong}” should be “${x.tok.right}.”`;fn=()=>{x.tok.fixed=true;pop=null;sel=null;draw();fixDone(q=>q===f,`Fixed! “${x.tok.right}” is correct.`);};}
    else if(f.k==='rw'){const x=byId(f.sid);txt=`Sentence ${x.num} reads better like this: “${x.rw[0]}”`;fn=()=>{x.rwFixed=true;pop=null;sel=null;draw();fixDone(q=>q===f,'Much better! Now it’s a complete, correct sentence.');};}
    else if(f.k==='cut'){const x=byId(f.sid);txt=`Sentence ${x.num} is off-topic. It doesn’t belong in this paragraph, so it gets cut.`;fn=()=>doCut(f.sid);}
    else if(f.k==='comb'){const C=D.combine;txt=`Sentences ${byId(C.a).num} and ${byId(C.b).num} join with “${C.j}”: “${C.res}”`;
      fn=()=>{const x=byId(C.a);x.mergedText=C.res;x.num=`${x.num}+${byId(C.b).num}`;order=order.filter(q=>q!==C.b);byId(C.b).gone=true;x.fresh=true;pop=null;sel=null;draw();fixDone(q=>q.k==='comb',`Combined! “${C.res}”`);checkMove();};}
    else{txt='One sentence is out of order. Here’s the order that makes sense.';fn=()=>{order=order.slice().sort((a,b)=>byId(a).ord-byId(b).ord);sel=null;draw();checkMove();};}
    api.answer(txt,fn);}
  function sentHTML(x){if(x.mergedText)return`<span class="stext">${x.mergedText}</span>`;
    let t=x.rwFixed?x.rw[0]:x.t;const m=t.match(/\{([^}]+)\}/);
    const wordsOf=str=>str.split(/(\s+)/).map(p=>/\s+/.test(p)?p:`<span class="wd">${p}</span>`).join('');
    if(!m)return`<span class="stext">${wordsOf(t)}</span>`;
    const [pre,post]=t.split(m[0]);const tokTxt=x.tok.fixed?x.tok.right:x.tok.wrong;
    return`<span class="stext">${wordsOf(pre)}<span class="tok ${x.tok.fixed?'fixed':''}">${tokTxt.split(' ').map(q=>`<span class="wd tk">${q}</span>`).join(' ')}</span>${wordsOf(post)}</span>`;}
  function draw(){strips.innerHTML='';
    order.forEach((id,k)=>{const x=byId(id);const st=h(`<div class="strip ${sel===id?'sel':''} ${x.fresh?'fresh':''}" data-id="${id}"><button class="snum">${x.num}</button>${sentHTML(x)}</div>`);x.fresh=false;
      st.querySelector('.snum').onclick=e=>{e.stopPropagation();if(finished)return;sel=sel===id?null:id;pop=null;draw();};
      st.querySelectorAll('.wd').forEach(wd=>wd.onclick=e=>{e.stopPropagation();if(finished)return;
        if(wd.classList.contains('tk')&&x.tok&&!x.tok.fixed){pop={id,type:'tok'};sel=null;draw();return;}
        api.coach('That word looks right to me. Keep reading!','info');});
      strips.append(st);
      if(sel===id){const tb=h(`<div class="stool"><button class="btn ghost sm up">↑</button><button class="btn ghost sm dn">↓</button><button class="btn sm cutb">✂ Cut</button><button class="btn sm cmb">🔗 Combine with next</button><button class="btn sm rwb">✎ Rewrite</button></div>`);
        tb.querySelector('.up').onclick=()=>moveSel(-1);tb.querySelector('.dn').onclick=()=>moveSel(1);
        tb.querySelector('.cutb').onclick=()=>doCut(id);tb.querySelector('.cmb').onclick=()=>{pop={id,type:'comb'};draw();};tb.querySelector('.rwb').onclick=()=>{pop={id,type:'rw'};draw();};
        strips.append(tb);}
      if(pop&&pop.id===id){let p;
        if(pop.type==='tok'){p=h(`<div class="spop"><span class="muted">Change it to:</span></div>`);x.tok.opts.filter(o=>o!==x.tok.wrong).concat([]).forEach(o=>{const b=h(`<button class="tile sm"></button>`);b.textContent=o;b.onclick=()=>{if(o===x.tok.right){x.tok.fixed=true;pop=null;draw();fixDone(f=>f.k==='tok'&&f.sid===id,`Fixed! “${o}” is correct.`);}else{b.classList.add('used');api.coach(x.note?x.note.replace(/^One /,'Think about it: one ').replace('is in the wrong form','needs its correct form'):'Not quite. Read the sentence out loud.');}};p.append(b);});}
        else if(pop.type==='comb'){const nid=order[k+1];p=h(`<div class="spop comb"><span>🔗 Combine ${x.num} + ${nid?byId(nid).num:'?'} with:</span></div>`);
          if(!nid){api.coach('There’s no sentence after this one to combine with.','info');pop=null;return draw();}
          JOINERS.forEach(j=>{const b=h(`<button class="tile sm">${j}</button>`);b.onclick=()=>{const C=D.combine;
            if(!C||!(id===C.a&&nid===C.b)){api.coach('Those two sentences don’t go together well. Look for two short sentences about the same thing.');pop=null;sel=null;draw();return;}
            if(j!==C.j){b.classList.add('used');api.coach(j==='because'||j==='so'?'Does one sentence cause the other? Try a different joining word.':j==='but'?'“But” shows a contrast. Do these two sentences disagree?':'Read it out loud with that word. Does it make sense?');return;}
            x.mergedText=C.res;x.num=`${x.num}+${byId(nid).num}`;order=order.filter(q=>q!==nid);byId(nid).gone=true;x.fresh=true;pop=null;sel=null;draw();fixDone(f=>f.k==='comb',`Combined! “${C.res}”`);checkMove();};p.append(b);});}
        else if(pop.type==='rw'){if(!x.rw||x.rwFixed){api.coach('This sentence is fine as written.','info');pop=null;return draw();}
          p=h(`<div class="spop rw"><span class="muted">Which is the best way to write this sentence?</span></div>`);shuffle(x.rw).forEach(o=>{const b=h(`<button class="rwopt"></button>`);b.textContent=o;b.onclick=()=>{if(o===x.rw[0]){x.rwFixed=true;pop=null;sel=null;draw();fixDone(f=>f.k==='rw'&&f.sid===id,'Much better! Now it’s a complete, correct sentence.');}else{b.classList.add('used');api.coach(/,\s(he|she|it|they|we|i)\s/i.test(o)?'A comma alone can’t join two complete thoughts. It needs a joining word too.':'Is that a complete sentence with a subject and a verb?');}};p.append(b);});}
        if(p)strips.append(p);}});
    paintNotes();}
  function moveSel(d){const k=order.indexOf(sel),j=k+d;if(j<0||j>=order.length)return;[order[k],order[j]]=[order[j],order[k]];tick(1000,.03,.04);draw();checkMove();}
  function checkMove(){const f=fixes.find(f=>f.k==='move');if(!f||f.ok)return;const live=order.filter(id=>!byId(id).cut||!byId(id).cutDone);
    const seq=live.map(id=>byId(id).ord);if(seq.every((v,k)=>k===0||v>seq[k-1]))fixDone(q=>q.k==='move','Now the sentences are in an order that makes sense!');}
  function doCut(id){const x=byId(id);if(!x.cut){api.coach('That sentence helps the paragraph. Look for one that’s off-topic.');sel=null;draw();return;}
    x.cutDone=true;order=order.filter(q=>q!==id);sel=null;tick(300,.12,.08);draw();fixDone(f=>f.k==='cut','Snip! That sentence didn’t belong.');checkMove();}
  w.querySelector('.hintb').onclick=()=>{const k=fixes.findIndex((f,i)=>!f.ok&&!hintsShown.has(i));if(k<0){api.coach('You’ve seen every hint. You’ve got this!','info');return;}hintsShown.add(k);api.coach(fixes[k].note);paintNotes();};
  send.onclick=()=>{if(finished||!fixes.every(f=>f.ok))return;finished=true;chime();burstAt(w.querySelector('.draft'));
    const ov=h(`<div class="overlay"><div class="modal"><div style="font-size:60px">📖</div><h2>Draft fixed!</h2><p>“${D.t}” is ready for the class book.</p><div class="row"><button class="btn gold">Continue</button></div></div></div>`);ov.querySelector('button').onclick=()=>{ov.remove();api.finish();};document.body.append(ov);};
  setAns();stage.append(w);draw();
};

(function(){const k=SITE_Q.get('kid');if(k&&S.profiles[k]){P=S.profiles[k];renderVault();}else if(SITE_Q.get('grownups')){gate();}else{renderHome();}})();
</script>
</body>

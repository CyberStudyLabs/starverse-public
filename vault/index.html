<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Vault</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{
  --space:#0B1026;--navy:#2D3B78;--purple:#6832F6;--blue:#22D3EE;--gold:#FFD93D;--orange:#FF8A3D;
  --pink:#FF5ACD;--mint:#7CFBB2;--black:#050A1A;--slate:#1C2444;--mist:#2D3768;--cloud:#F5F8FF;--lilac:#EEF0FF;
  --ink:#1C2444;--text:#F5F8FF;--muted:#B7BEE6;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Starverse chrome is dark by design in both system themes; reading surfaces use Cloud/Lilac. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#F5F8FF}}
:root[data-theme="dark"]{--text:#F5F8FF}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--black);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(circle at 85% 8%,#6832F640,transparent 38%),
   radial-gradient(circle at 8% 92%,#FF5ACD26,transparent 40%),
   radial-gradient(circle at 50% 50%,#0B1026,#050A1A 75%)}
.sky::before,.sky::after{content:"";position:absolute;inset:0;
  background-image:
   radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 64%,#fff,transparent),
   radial-gradient(1.5px 1.5px at 47% 12%,#FFD93D,transparent),radial-gradient(1px 1px at 66% 38%,#fff,transparent),
   radial-gradient(1.5px 1.5px at 81% 72%,#22D3EE,transparent),radial-gradient(1px 1px at 92% 22%,#fff,transparent),
   radial-gradient(1px 1px at 6% 48%,#fff,transparent),radial-gradient(1.5px 1.5px at 38% 88%,#fff,transparent),
   radial-gradient(1px 1px at 58% 82%,#FF5ACD,transparent),radial-gradient(1px 1px at 74% 6%,#fff,transparent)}
.sky::after{transform:translate(37%,23%) scale(1.3);opacity:.6;animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.8}}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 16px 40px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2{margin:0}
.btn{font-weight:800;font-size:18px;border:0;border-radius:16px;padding:14px 22px;background:var(--purple);color:#fff;box-shadow:0 4px 0 #3d1a9e;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3d1a9e}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:var(--gold);color:var(--space);box-shadow:0 4px 0 #b8941c}
.btn.gold:active{box-shadow:0 1px 0 #b8941c}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--mist);box-shadow:none}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:12px}
.btn.big{font-size:21px;padding:18px 26px;width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.paper{background:var(--cloud);color:var(--ink);border-radius:22px;padding:18px 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.topbar .who,.topbar .gname{font-family:'Baloo 2';font-weight:800;font-size:20px;text-align:center;flex:1}
.prog{display:flex;gap:6px;min-width:70px;justify-content:flex-end}
.dot{width:11px;height:11px;border-radius:50%;background:var(--mist)}
.dot.on{background:var(--gold)}
.dot.cur{box-shadow:0 0 0 2px var(--blue)}

/* home */
.brand{text-align:center;margin:18px 0 26px}
.logo{font-family:'Baloo 2';font-weight:800;font-size:clamp(52px,13vw,84px);line-height:.95;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--gold) 10%,var(--orange) 45%,var(--pink) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--muted);font-weight:700;margin-top:6px}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:540px){.profiles{grid-template-columns:1fr}}
.pcard{background:var(--slate);border:2px solid var(--mist);border-radius:26px;padding:22px 18px;color:var(--text);text-align:center;transition:transform .12s,border-color .12s}
.pcard:hover{transform:translateY(-3px)}
.pcard.g2:hover{border-color:var(--blue)}.pcard.g5:hover{border-color:var(--pink)}
.pav{font-size:54px;line-height:1}
.pname{font-family:'Baloo 2';font-weight:800;font-size:25px;margin-top:8px;line-height:1.1}
.pgrade{color:var(--muted);font-weight:700}
.pstat{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:999px;background:var(--mist);font-weight:800;font-size:15px}
.pstreak{margin-top:8px;color:var(--gold);font-weight:800}
.link{display:block;margin:30px auto 0;background:none;border:0;color:var(--muted);font-weight:700;text-decoration:underline;font-size:15px}

/* vault */
.vaulthead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.lock{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:36px;
  background:radial-gradient(circle at 35% 30%,#3d4c94,var(--navy));border:5px solid var(--gold);box-shadow:0 0 24px #FFD93D55}
.lock.open{border-color:var(--mint);box-shadow:0 0 24px #7CFBB266}
.title{font-family:'Baloo 2';font-weight:800;font-size:32px;line-height:1.05}
.sub{color:var(--muted);font-weight:700}
.riddle .rq{font-weight:800;font-size:20px;line-height:1.35}
.letters{display:flex;gap:8px;justify-content:center;margin-top:16px}
.letter{width:54px;height:62px;border-radius:14px;border:3px solid var(--navy);display:grid;place-items:center;
  font-family:'Baloo 2';font-weight:800;font-size:34px;color:var(--navy);background:#fff}
.letter.hid{background:var(--lilac);color:#9aa2d6;border-style:dashed}
.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.hidwrap{text-align:center}
.hidwrap .q{font-weight:800;font-size:19px;margin-bottom:12px}
.hidden{position:relative;width:210px;height:210px;margin:0 auto;border-radius:50%;overflow:hidden}
.hidden .cover{position:absolute;top:0;bottom:0;width:20%;background:var(--navy);
  background-image:radial-gradient(circle at 50% 30%,#FFD93D 0 2px,transparent 3px),radial-gradient(circle at 30% 75%,#ffffff 0 1.5px,transparent 2.5px);
  border-right:2px solid #3d4c94;transition:transform .8s ease,opacity .8s ease}
.hidden .cover.off{transform:translateY(-110%);opacity:0}
.tray{display:flex;justify-content:center;gap:10px;margin:22px 0 6px}
.slotc{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;
  background:var(--slate);border:3px dashed var(--mist)}
.slotc.on{background:radial-gradient(circle at 35% 30%,#fff3a8,var(--gold));border:3px solid #fff3a8;box-shadow:0 0 18px #FFD93D88}
.slotc.next{border-color:var(--blue);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #22D3EE33}}
.traylabel{text-align:center;color:var(--muted);font-weight:700;font-size:15px}
.cta{margin-top:20px}
.fun{margin-top:22px;text-align:center}
.fun h2{font-family:'Nunito';font-size:18px;color:var(--muted);margin-bottom:4px}

/* games */
.coach{min-height:62px;margin-top:16px}
.msg{display:flex;gap:10px;align-items:flex-start;background:var(--lilac);color:var(--ink);border-left:7px solid var(--blue);border-radius:14px;padding:12px 14px;font-weight:700;animation:pop .35s ease-out}
.msg.good{border-left-color:var(--mint)}
.msg .ico{font-size:20px;line-height:1.2}
.prompt{font-weight:700;font-size:19px;text-align:center}
.prompt b{font-family:'Baloo 2';font-size:24px;color:var(--purple)}
.speak{background:var(--navy);color:#fff;border:0;border-radius:50%;width:42px;height:42px;font-size:20px;flex:none}

/* coin */
.tag{display:flex;align-items:center;justify-content:center;gap:16px}
.tag .em{font-size:58px}
.tag .amt{font-family:'Baloo 2';font-weight:800;font-size:52px;color:var(--navy);line-height:1}
.tag .what{font-weight:700}
.vslot{min-height:110px;margin-top:16px;background:var(--slate);border:3px dashed var(--mist);border-radius:22px;padding:12px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.vslot .ph{color:var(--muted);font-weight:700}
.vslot button{background:none;border:0;padding:0;animation:pop .3s ease-out}
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cbtn{background:var(--slate);border:2px solid var(--mist);border-radius:18px;padding:10px 4px 8px;color:var(--text);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px}
.cbtn:active{transform:scale(.95)}
.help{margin-top:12px;text-align:center;font-weight:800;color:var(--gold)}
.tag .dollar{color:#5b6390;font-weight:700}
.totbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;min-height:40px}
.tot{font-family:'Baloo 2';font-weight:800;font-size:28px;color:var(--gold)}
.chal{color:var(--muted);font-weight:800}
.alert{margin-top:10px;background:#E11D48;color:#fff;font-weight:800;border-radius:14px;padding:10px 14px;text-align:center;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.vslot.over{border-color:#E11D48;border-style:solid}
.plus{position:fixed;z-index:40;pointer-events:none;font-family:'Baloo 2';font-weight:800;font-size:28px;animation:rise .9s ease-out forwards}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.hl{background:var(--orange);color:var(--space);padding:0 6px;border-radius:6px}

/* builder */
.wcard{text-align:center}
.wcard .em{font-size:96px;line-height:1.1}
.word{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-top:8px;font-family:'Baloo 2';font-weight:800;font-size:58px;line-height:1;color:var(--ink)}
.gap{display:inline-block;min-width:1.1em;border-bottom:5px solid var(--purple);color:var(--purple);text-align:center;margin:0 3px;height:1em}
.gap.fill{border-bottom-color:transparent;animation:pop .45s ease-out}
.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tile{background:var(--lilac);color:var(--ink);border:0;border-radius:16px;padding:12px 22px;font-family:'Baloo 2';font-weight:800;font-size:32px;box-shadow:0 4px 0 #b9bde6;min-width:90px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #b9bde6}
.tile.used{opacity:.3;pointer-events:none}
.tile.sm{font-size:24px;padding:10px 16px;min-width:70px}

/* forge */
.slots{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.fslot{min-width:96px;height:66px;padding:0 12px;border-radius:16px;border:3px dashed var(--mist);background:var(--slate);
  display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:26px;color:var(--text)}
.fslot.full{border:3px solid var(--blue);background:var(--navy)}
.forged{font-family:'Baloo 2';font-weight:800;font-size:44px;text-align:center;color:var(--gold);margin-top:10px;animation:pop .5s ease-out}
.parts{text-align:center;color:var(--muted);font-weight:700}

/* navigator */
.navwrap{margin:14px auto 0;max-width:440px}
svg.nav{width:100%;height:auto;display:block;touch-action:manipulation;cursor:crosshair}
.ship{transition:transform .9s ease-in-out}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* overlay */
.overlay{position:fixed;inset:0;z-index:20;background:#050A1Aee;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{background:var(--slate);border:2px solid var(--mist);border-radius:30px;padding:26px 22px;text-align:center;max-width:470px;width:100%}
.modal h2{font-family:'Baloo 2';font-weight:800;font-size:32px;line-height:1.1}
.modal p{color:var(--muted);font-weight:700}
.bigletter{font-family:'Baloo 2';font-weight:800;font-size:90px;line-height:1;color:var(--gold);margin:8px 0;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.door{width:150px;height:150px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:60px;
  background:radial-gradient(circle at 35% 30%,#3d4c94,var(--navy));border:8px solid var(--gold);
  animation:dooropen 1.3s ease-in forwards}
@keyframes dooropen{0%{transform:rotate(0)}55%{transform:rotate(-200deg) scale(1)}100%{transform:rotate(-260deg) scale(.1);opacity:0}}
.reveal{opacity:0;animation:revealin .7s ease-out 1.2s forwards}
@keyframes revealin{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.prizebox{position:relative}
.prizebox .door{position:absolute;left:50%;top:20px;margin-left:-75px;z-index:2}
.art{display:flex;justify-content:center;margin:6px 0 4px}
.cname{font-family:'Baloo 2';font-weight:800;font-size:28px;line-height:1.1;color:var(--gold)}
.ridans{margin-bottom:14px}
.ridans .ra{font-family:'Baloo 2';font-weight:800;font-size:40px;letter-spacing:.06em;color:var(--purple);line-height:1.1;margin-top:6px}

.critter{border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 35% 30%,var(--c1),var(--c2));box-shadow:inset 0 0 0 6px #ffffff40,0 0 30px color-mix(in srgb,var(--c1) 50%,transparent)}
.critter::after{content:"";position:absolute;width:30%;height:16%;left:18%;top:14%;border-radius:50%;background:#ffffff70;transform:rotate(-30deg)}
.critter span{line-height:1}

/* gallery */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.gcard{background:var(--slate);border:2px solid var(--mist);border-radius:22px;padding:14px;text-align:center}
.gcard .n{font-family:'Baloo 2';font-weight:800;font-size:17px;line-height:1.15;margin-top:6px}
.gcard .d{color:var(--muted);font-size:14px;font-weight:700}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:40px 10px}

/* grown-ups */
.gu{display:grid;gap:16px}
.gu .paper label{font-weight:800;display:block;margin-bottom:6px}
.gu input{width:100%;font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid #c9cdee;color:var(--ink);background:#fff}
.gu .row{justify-content:flex-start}
.btn.warn{background:var(--orange);color:var(--space);box-shadow:0 4px 0 #b55c1f}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.02;margin:0 .08em}
.fr span:first-child{border-bottom:.09em solid currentColor;padding:0 .12em}
.whole{margin-right:.08em}
.target{font-family:'Baloo 2';font-weight:800;font-size:46px;color:var(--navy);margin-top:6px;line-height:1.1}
.rule{font-size:15px;color:#5b6390;margin-top:6px}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;justify-items:center}
@media (max-width:420px){.shelf{grid-template-columns:repeat(3,1fr)}}
.bottle{position:relative;background:none;border:0;padding:0;transition:transform .15s}
.bottle svg{display:block;transition:filter .15s}
.bottle .lab{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);font-family:'Nunito';font-weight:800;font-size:18px;padding:2px 8px;border-radius:9px;white-space:nowrap;box-shadow:0 2px 0 #0003}
.bottle.on{transform:translateY(-8px)}
.bottle.on svg{filter:drop-shadow(0 0 10px #FFD93D) drop-shadow(0 0 4px #FFD93D)}
.bottle.on .lab{outline:3px solid var(--gold)}
.arena{position:relative;height:84px;background:var(--slate);border:2px solid var(--mist);border-radius:18px;margin-bottom:14px;overflow:hidden}
.arena .alien,.arena .me{position:absolute;top:50%;transform:translateY(-50%);font-size:40px}
.arena .alien{left:14px}.arena .me{right:14px}
.arena .laser{position:absolute;left:66px;right:66px;top:50%;height:4px;margin-top:-2px;background:linear-gradient(90deg,#FF5ACD,#FF8A3D);border-radius:2px;animation:zap 1.1s ease-in-out infinite}
@keyframes zap{50%{opacity:.35}}
.arena.blocked .laser{right:50%;animation:none}
.arena.blocked::after{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:10px;border-radius:6px;background:var(--blue);box-shadow:0 0 22px var(--blue);animation:pop .4s ease-out}
.bars{margin-top:14px;display:grid;gap:8px}
.barrow{display:flex;align-items:center;gap:10px}
.bl{width:58px;font-weight:800;color:var(--muted);font-size:14px;text-align:right}
.track{flex:1;position:relative;height:34px;border-radius:10px;background:var(--slate);border:2px dashed var(--mist);display:flex;overflow:hidden}
.seg{height:100%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--space);border-right:2px solid var(--space);transition:width .3s}
.seg.goal{background:repeating-linear-gradient(45deg,#22D3EE55 0 6px,#22D3EE22 6px 12px);border:2px solid var(--blue);border-radius:8px 0 0 8px;color:var(--text)}
.pieces .tile.on{background:var(--gold);box-shadow:0 4px 0 #b8941c}
.pond{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.crate{flex:1;max-width:210px;background:var(--cloud);color:var(--ink);border:0;border-radius:20px;padding:12px 8px;box-shadow:0 5px 0 #b9bde6;transition:transform .1s}
.crate:active{transform:translateY(3px)}
.crate .num{font-family:'Baloo 2';font-weight:800;font-size:38px;line-height:1}
.crate .food{font-size:22px}
.gator{flex:none;transition:transform .35s}
.gator.left{transform:scaleX(-1)}
.gsvg .jaw-up,.gsvg .jaw-dn{transform-origin:18px 50px;transition:transform .35s}
.gator.closed .jaw-up{transform:translateY(-11px) rotate(21.8deg)}
.gator.closed .jaw-dn{transform:translateY(11px) rotate(-21.8deg)}
.gator.chomp{animation:chomp .5s ease-in-out}
.gator.left.chomp{animation:chompL .5s ease-in-out}
@keyframes chomp{50%{transform:scale(1.18)}}
@keyframes chompL{50%{transform:scaleX(-1.18) scaleY(1.18)}}
.b10{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;justify-content:center;max-width:170px;margin:8px auto 0}
.b10 .hund{width:26px;height:26px;border:2px solid var(--purple);background-color:#6832F61a;background-image:linear-gradient(#6832F655 1px,transparent 1px),linear-gradient(90deg,#6832F655 1px,transparent 1px);background-size:2.4px 2.4px}
.b10 .ten{width:6px;height:26px;background:var(--orange);border-radius:1px}
.b10 .one{width:7px;height:7px;background:var(--pink);border-radius:1px}
.b10 .brk{flex-basis:100%;height:0}
.sentence{text-align:center;font-family:'Baloo 2';font-weight:800;font-size:44px;color:var(--gold);min-height:58px;margin-top:6px}
.frogsvg{width:100%;height:auto;display:block;margin-top:14px}
.frog{transition:transform .5s ease-in-out}
.frog.hop text{animation:hop .5s ease-in-out}
@keyframes hop{50%{transform:translateY(-26px)}}
.sent{margin-top:14px;font-size:20px;font-weight:700}
.spell{display:block;width:100%;max-width:340px;margin:16px auto 0;font-family:'Baloo 2';font-weight:800;font-size:40px;text-align:center;padding:8px 12px;border-radius:16px;border:3px solid var(--mist);background:var(--cloud);color:var(--ink);letter-spacing:.06em}
.lslots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.lslot{width:44px;height:54px;border-radius:12px;border:3px dashed var(--mist);background:var(--slate);display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:30px}
.lslot.full{border:3px solid var(--blue);background:var(--navy)}
.tile.shake{animation:shake .4s}
.ctrack{position:relative;height:74px;background:var(--slate);border:2px solid var(--mist);border-radius:18px;overflow:hidden}
.ctrack>*{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .35s ease-out}
.ctrack .runner{font-size:34px}
.ctrack .goal{left:94%;font-size:34px}
.ctrack .hole{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle,#000 35%,#2a0f6e 55%,#6832F6 68%,transparent 72%);box-shadow:0 0 24px #6832F6;transition:left .1s linear}
.ctrack.hit{animation:shake .4s}
.ctimer{text-align:center;font-family:'Baloo 2';font-weight:800;font-size:24px;color:var(--gold);margin-top:8px}

function art(c,size){
  if(c.kind==='critter')return`<div class="critter" style="width:${size}px;height:${size}px;--c1:${c.c1};--c2:${c.c2}"><span style="font-size:${Math.round(size*.48)}px">${c.emoji}</span></div>`;
  const id=c.id+Math.floor(Math.random()*1e6);
  let bands='';for(let i=0;i<c.bands;i++){const yy=78+i*24;bands+=`<ellipse cx="100" cy="${yy}" rx="80" ry="${6+i*2}" fill="#fff" opacity=".22"/>`;}
  const ringBack=c.ring?`<g transform="rotate(${c.tilt} 100 100)"><ellipse cx="100" cy="100" rx="92" ry="20" fill="none" stroke="${c.rc}" stroke-width="7" opacity=".85"/></g>`:'';
  const ringFront=c.ring?`<g transform="rotate(${c.tilt} 100 100)" clip-path="url(#f${id})"><ellipse cx="100" cy="100" rx="92" ry="20" fill="none" stroke="${c.rc}" stroke-width="7"/></g>`:'';

   ${ringBack}<circle cx="100" cy="100" r="58" fill="url(#g${id})"/>
   <g clip-path="url(#c${id})" transform="rotate(${c.tilt/2} 100 100)">${bands}</g>
   <ellipse cx="80" cy="74" rx="16" ry="9" fill="#fff" opacity=".35" transform="rotate(-30 80 74)"/>
   ${ringFront}${c.moon?`<circle cx="166" cy="44" r="11" fill="#EEF0FF"/><circle cx="162" cy="41" r="3" fill="#B7BEE6"/>`:''}</svg>`;
}

const SKILL={
 coin:['Money Master','Counting coins'],builder:['Sound Builder','Phonics patterns'],spell:['Super Speller','Spelling (dictation)'],
 gator:['Number Muncher','Comparing numbers to 1,200'],frog:['Number Line Ninja','Number lines (tens and hundreds)'],
 syllable:['Syllable Slicer','Syllable division'],compound:['Word Smasher','Compound words'],fixer:['Sentence Fixer','Capitals and end punctuation'],
 nav:['Star Navigator','Coordinate grid'],potion:['Potion Master','Fraction/decimal equivalence'],shield:['Fraction Defender','Equivalent fractions, adding unlike denominators'],
 forge:['Word Smith','Prefixes, suffixes, roots'],silly:['Grammar Guru','Parts of speech'],context:['Clue Detective','Context clues'],
 shades:['Word Thermometer','Shades of meaning'],proof:['Evidence Finder','Context clues: proving it with evidence'],hand:['Handwriting Hero','Letter and number formation (tracing)'],circuit:['Circuit Whiz','Circuits, conductors and insulators'],laser:['Light Bender','Light: reflect, refract, absorb'],bowl:['Force Hero','Pushes and pulls'],cycle:['Life Cycle Pro','Life cycles'],weather:['Weather Watcher','Measuring and graphing weather'],map:['Map Master','Maps and geography'],pour:['Fraction Chef','Multiplying and dividing fractions'],edit:['Draft Doctor','Revising and editing'],pizza:['Pizza Pro','Halves, fourths, and eighths'],magnet:['Magnet Master','Magnetism and separating mixtures'],figur:['Figure-It-Out Pro','Figurative language']};
function skillName(g,p,adult){if(g==='chase')return adult?(p.grade===2?'Add/subtract facts within 20':'Multiply/divide facts'):'Fact Flash';return SKILL[g]?SKILL[g][adult?1:0]:g;}
const acc=s=>s&&s.n?Math.round(s.c/s.n*100):0;
function statOf(type){P.stats=P.stats||{};return P.stats[type]||(P.stats[type]={n:0,c:0,h:0});}
/* every count also goes in a per-day log, so the Report Card can show a single day or a range */
function dayLog(){P.log=P.log||{};const d=today(),L=P.log[d]||(P.log[d]={g:{},t0:Date.now(),t1:Date.now()});L.t1=Date.now();return L;}
function bump(type,f){const s=statOf(type);s[f]=(s[f]||0)+1;const L=dayLog(),g=L.g[type]||(L.g[type]={n:0,c:0,h:0,r:0});g[f]=(g[f]||0)+1;}
const TEKS={2:{coin:'Math 2.5A, 2.5B',gator:'Math 2.2D',frog:'Math 2.2E, 2.2F, 2.7B',chase:'Math 2.4A',pizza:'Math 2.3A–D',builder:'RLA 2.2B',spell:'RLA 2.2C',syllable:'RLA 2.2B',compound:'RLA 2.2B',fixer:'RLA 2.11D',context:'RLA 2.3B',proof:'RLA 2.3B, 2.7C',bowl:'Science 2.7A, 2.7B',cycle:'Science 2.13D',weather:'Science 2.10B',map:'Social Studies 2.4A, 2.4B',hand:''},
  5:{nav:'Math 5.8A–C',potion:'Review of 4.2G',shield:'Math 5.3H',chase:'Review of 3.4F',pour:'Math 5.3I, 5.3J, 5.3L',forge:'RLA 5.3C',silly:'RLA 5.11D',context:'RLA 5.3B',proof:'RLA 5.3B, 5.7C',shades:'RLA 5.3',figur:'RLA 5.10D, 5.10G',edit:'RLA 5.11C, 5.11D',circuit:'Science 5.6A, 5.8A, 5.8B',laser:'Science 5.8C',magnet:'Science 5.6A, 5.6B',map:'Social Studies 5.6C, 5.6D',hand:'RLA 5.2C'}};
const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function reportData(range){const L=P.log||{},t=today(),wk=(()=>{const d=new Date();d.setDate(d.getDate()-6);return ymd(d);})();
  const days=Object.keys(L).filter(d=>range==='all'||(range==='week'?d>=wk&&d<=t:d===t)).sort();
  const g={};let ms=0;days.forEach(d=>{const x=L[d];ms+=Math.max(0,(x.t1||0)-(x.t0||0));Object.entries(x.g||{}).forEach(([k,v])=>{const a=g[k]||(g[k]={n:0,c:0,h:0,r:0});['n','c','h','r'].forEach(f=>a[f]+=v[f]||0);});});
  const help=(P.help||[]).filter(x=>days.includes(x.date));return{days,g,mins:Math.max(1,Math.round(ms/60000)),help};}
function reportHTML(name,range){const R=reportData(range),gr=P.grade,T=TEKS[gr]||{};

/* ---------- no-repeat decks ---------- */
function deal(key,pool,n){P.decks=P.decks||{};const id=x=>String(hashStr(typeof x==='string'?x:JSON.stringify(x)));
  let used=new Set(P.decks[key]||[]);let fresh=pool.filter(x=>!used.has(id(x)));let out=shuffle(fresh).slice(0,n);
  if(out.length<n){used=new Set();const extra=shuffle(pool.filter(x=>!out.includes(x))).slice(0,n-out.length);out=out.concat(extra);P.decks[key]=out.map(id);}
  else P.decks[key]=[...used,...out.map(id)];
  save();return out;}

const GAMES={};
function renderGame(type,level,onDone,onBack){
  app.innerHTML='';
  const g=GAME[type];

    <div class="stage"></div><div class="coach" aria-live="polite"></div></div>`);
  const coachEl=w.querySelector('.coach'),prog=w.querySelector('.prog'),stage=w.querySelector('.stage');
  let alive=true,missed=false,missN=0,ans=null,rtok=0;
  /* Two tries, then gently show the answer: each game registers the current problem's answer with api.answer(text, fn).
     On the 2nd wrong try the coach line shows first, then a banner explains the answer; "Got it" runs fn, which shows it and moves on. */
  function reveal(a){const ov=h(`<div class="overlay"><div class="modal reveal"><div style="font-size:54px">💡</div><h2>Let’s look at it together</h2><p class="rtx"></p><div class="row"><button class="btn gold">Got it ➜</button></div></div></div>`);
    ov.querySelector('.rtx').textContent=a.text;bump(type,'r');save();
    ov.querySelector('button').onclick=()=>{ov.remove();if(!alive)return;api.clear();try{a.fn&&a.fn();}catch(e){}};
    document.body.append(ov);kidSay(a.text);}
  const api={
    answer(text,fn){ans=text?{text,fn}:null;missN=0;rtok++;},
    prog(i,n){prog.innerHTML=Array.from({length:n},(_,k)=>`<span class="dot ${k<i?'on':''} ${k===i?'cur':''}"></span>`).join('');},
    coach(msg,kind='hint'){coachEl.innerHTML='';const m=h(`<div class="msg ${kind}"><span class="ico">${kind==='good'?'✨':'🧭'}</span><span></span></div>`);m.lastChild.textContent=msg;coachEl.append(m);kidSay(msg);
      if(kind==='hint'){missed=true;bump(type,'h');save();missN++;
        if(missN>=2&&ans){const a=ans,tk=++rtok;ans=null;setTimeout(()=>{if(alive&&tk===rtok&&stage.isConnected)reveal(a);},1300);}}
      if(kind==='good'){rtok++;ans=null;api.tick();}},
    tick(){bump(type,'n');if(!missed)bump(type,'c');statOf(type).last=today();missed=false;missN=0;save();},
    clear(){coachEl.innerHTML='';},
    later(fn,ms){setTimeout(()=>{if(alive)fn();},ms);},
    finish(){alive=false;onDone();}
  };
  w.querySelector('.back').onclick=()=>{alive=false;onBack();};
  w.querySelector('.helpme').onclick=()=>{
    P.help=P.help||[];P.help.push({date:today(),t:Date.now(),game:type,text:stage.textContent.replace(/\s+/g,' ').trim().slice(0,240),done:false});save();
    const ov=h(`<div class="overlay"><div class="modal"><div style="font-size:60px">🙋</div><h2>Got it!</h2><p>${MODE==='class'?'Raise your hand and show your teacher this problem.':'A grown-up will help you with this one.'} You can keep trying, and the coach will give you hints along the way.</p><div class="row"><button class="btn gold">Okay</button></div></div></div>`);
    ov.querySelector('button').onclick=()=>ov.remove();document.body.append(ov);kidSay(MODE==='class'?'Got it! Raise your hand and show your teacher.':'Got it! A grown-up will help you with this one.');};

const COINS=[
 {k:'q',name:'quarter',v:25,r:24,fill:'#D3D8E0',edge:'#7E8798',ridge:true},
 {k:'d',name:'dime',v:10,r:17,fill:'#D3D8E0',edge:'#7E8798',ridge:true},

 {k:'p',name:'penny',v:1,r:18.5,fill:'#C8763D',edge:'#7E4219',ridge:false}];
function coinSVG(c,size){
  return`<svg viewBox="-26 -26 52 52" width="${size}" height="${size}" aria-hidden="true">
   <circle r="${c.r}" fill="${c.fill}" stroke="${c.edge}" stroke-width="2.4" ${c.ridge?'stroke-dasharray="1.6 1.2"':''}/>
   <circle r="${c.r-4}" fill="none" stroke="${c.edge}" stroke-width=".9" opacity=".7"/>
   <ellipse cx="${-c.r*.35}" cy="${-c.r*.4}" rx="${c.r*.35}" ry="${c.r*.18}" fill="#fff" opacity=".45" transform="rotate(-35 ${-c.r*.35} ${-c.r*.4})"/>
   <text y="${c.r*.28}" text-anchor="middle" font-size="${c.r*.8}" fill="${c.edge}" font-family="Baloo 2" font-weight="800">★</text></svg>`;
}
function minCoins(a){let n=0;for(const v of[25,10,5,1]){n+=Math.floor(a/v);a%=v;}return n;}
GAMES.coin=function(stage,level,api){
  const lv=level==null?rnd(0,4):level;
  const ranges=[[6,35],[15,50],[25,70],[35,85],[45,99]];
  const goods=shuffle([['🍭','lollipop'],['🍪','cookie'],['✏️','pencil'],['🎈','balloon'],['🧃','juice box'],['🍌','banana'],['🏀','bouncy ball'],['🖍️','crayon'],['🍎','apple'],['🎟️','ticket'],['🧁','cupcake'],['🦖','dino sticker']]);
  const types=level==null?shuffle(['normal','fewest','two']):lv>=3?['hidden','fewest','two']:['normal','normal','normal'];
  const items=goods.slice(0,3).map((g,k)=>{const[a,b]=ranges[lv];return{g,type:types[k],amt:rnd(types[k]==='two'||types[k]==='fewest'?Math.max(a,15):a,b)};});
  let i=0,tray=[],miss=0,locked=false,freeShow=true;
  const money=c=>'$'+(c/100).toFixed(2);
  function show(){
    const it=items[i];tray=[];miss=0;locked=false;api.prog(i,items.length);api.clear();
    const showTot=it.type==='hidden'?false:level==null?freeShow:true;let wasOver=false,firstWay=null;
    stage.innerHTML='';
    const task={normal:`Make exactly ${it.amt}¢.`,hidden:`Challenge: make exactly ${it.amt}¢ and count it yourself!`,fewest:`Make ${it.amt}¢ using the FEWEST coins you can.`,two:`Find 2 different ways to make ${it.amt}¢!`}[it.type];
    const w=h(`<div><div class="paper"><div class="tag"><div class="em">${it.g[0]}</div><div><div class="what">The ${it.g[1]} costs</div><div class="amt">${it.amt}¢</div><div class="dollar">that’s ${money(it.amt)}</div></div><button class="speak" aria-label="Read aloud">🔊</button></div>
      <div class="ctask">${task}</div><div class="way1" hidden></div></div>
      <div class="totbar">${showTot?'<span class="tot">Total: $0.00</span>':'<span class="chal">Count it yourself!</span>'}${level==null&&it.type!=='hidden'?`<button class="btn ghost sm tog">${freeShow?'Hide':'Show'} total</button>`:''}</div>
      <div class="vslot"></div><div class="alert" hidden></div><div class="bank"></div>
      <div class="row"><button class="btn ghost clr">Clear</button><button class="btn ghost hint">💡 Coin help</button><button class="btn gold pay">Pay</button></div>
      <div class="help" hidden>quarter 25¢ · dime 10¢ · nickel 5¢ · penny 1¢</div></div>`);
    const prompt=`The ${it.g[1]} costs ${it.amt}¢. ${task}`;
    w.querySelector('.speak').onclick=()=>say(prompt);
    const slot=w.querySelector('.vslot'),help=w.querySelector('.help'),totEl=w.querySelector('.tot'),alertEl=w.querySelector('.alert'),way1=w.querySelector('.way1');
    function plus(el,txt,color){const r=el.getBoundingClientRect(),s=document.createElement('span');s.className='plus';s.textContent=txt;s.style.color=color;
      s.style.left=(r.left+r.width/2-26)+'px';s.style.top=(r.top-6)+'px';document.body.append(s);setTimeout(()=>s.remove(),950);}
    function draw(){slot.innerHTML='';
      const tot=tray.reduce((s,c)=>s+c.v,0);
      if(totEl)totEl.textContent='Total: '+money(tot);
      const over=showTot&&tot>it.amt;
      alertEl.hidden=!over;slot.classList.toggle('over',over);
      if(over)alertEl.textContent=`Too much! You’re over ${it.amt}¢. Tap a coin to take it back out.`;
      if(over&&!wasOver)kidSay('Too much! Tap a coin to take it back out.');
      wasOver=over;
      if(!tray.length)slot.append(h(`<span class="ph">Tap coins to drop them in</span>`));
      tray.forEach((c,idx)=>{const b=h(`<button aria-label="Take out ${c.name}">${coinSVG(c,Math.round(c.r*2.5))}</button>`);
        b.onclick=()=>{if(locked)return;plus(b,'−'+c.v+'¢','#FF8A3D');tray.splice(idx,1);draw();};slot.append(b);});}
    COINS.forEach(c=>{const b=h(`<button class="cbtn">${coinSVG(c,58)}<span>${c.name}</span></button>`);
      b.onclick=()=>{if(locked||tray.length>=16)return;tray.push(c);plus(b,'+'+c.v+'¢','#FFD93D');draw();};w.querySelector('.bank').append(b);});
    const tog=w.querySelector('.tog');if(tog)tog.onclick=()=>{freeShow=!freeShow;show();};
    w.querySelector('.clr').onclick=()=>{if(!locked){tray=[];draw();}};
    w.querySelector('.hint').onclick=()=>{help.hidden=false;kidSay('A quarter is 25 cents. A dime is 10 cents. A nickel is 5 cents. A penny is 1 cent.');};
    const key=t=>t.map(c=>c.v).sort((a,b)=>b-a).join(',');

      if(locked)return;
      if(!tray.length){api.coach('Drop some coins in first!','info');return;}
      const tot=tray.reduce((s,c)=>s+c.v,0);

      if(it.type==='two'&&!firstWay){firstWay=key(tray);way1.hidden=false;way1.innerHTML='<b>Way 1:</b> ';tray.forEach(c=>way1.insertAdjacentHTML('beforeend',coinSVG(c,30)));

      if(it.type==='two'&&key(tray)===firstWay){api.coach('Those are the same coins as Way 1! Try trading one coin for smaller coins.');return;}
      locked=true;
      api.coach(it.type==='two'?`Two ways to make ${it.amt}¢. Awesome!`:it.type==='fewest'?`${it.amt}¢ with just ${tray.length} coin${tray.length>1?'s':''}. That’s the fewest!`:`Exactly ${it.amt}¢! The vault clicks open.`,'good');next();

    const alt=(()=>{const g=greedy.slice(),k=g.findIndex(c=>c.v>1);if(k<0)return g;const c=g[k],C=v=>COINS.find(x=>x.v===v);
      const parts=c.v===25?[C(10),C(10),C(5)]:c.v===10?[C(5),C(5)]:[C(1),C(1),C(1),C(1),C(1)];g.splice(k,1,...parts);return g;})();
    const list=arr=>{const m={};arr.forEach(c=>m[c.name]=(m[c.name]||0)+1);return Object.entries(m).map(([n,k])=>`${k} ${k===1?n:n==='penny'?'pennies':n+'s'}`).join(' + ');};
    const pay=w.querySelector('.pay'),fill=arr=>{tray=arr.slice();draw();};
    if(it.type==='two')api.answer(`Here are 2 ways to make ${it.amt}¢. Way 1: ${list(greedy)}. Way 2: ${list(alt)}.`,()=>{if(!firstWay){fill(greedy);pay.click();}fill(firstWay===key(greedy)?alt:greedy);pay.click();});
    else api.answer(`${list(greedy)} makes exactly ${it.amt}¢.${it.type==='fewest'?' Start with the biggest coins to use the fewest.':' Start with the biggest coin and count up.'}`,()=>{fill(greedy);pay.click();});
    draw();stage.append(w);kidSay(prompt);
  }
  show();
};

    const trU=shuffle(traps).filter(x=>{const k=labKey(x.l);if(seen.has(k)||sameV(labVal(x.l),tv))return false;seen.add(k);return true;}).slice(0,8-eqU.length);
    return{target,bottles:shuffle([...eqU.map(l=>({l,ok:true})),...trU.map(x=>({l:x.l,ok:false,t:x.t}))])};
  }
  function show(){
    const it=build(targets[i]);locked=false;api.prog(i,targets.length);api.clear();stage.innerHTML='';

      if(sel.size<it.bottles.filter(b=>b.ok).length){api.coach('Good picks! But some matching bottles are still on the shelf. Check every one.');return;}

/* ---------- Shield Up (Gr 5) ---------- */
GAMES.shield=function(stage,level,api){
  const lv=level==null?rnd(0,4):level,build=lv>=3,N=3,v120=f=>f.n*120/f.d,pct=f=>v120(f)/1.2;
  let i=0;
  function single(){
    let a,b;do{b=pick([2,3,4,5,6]);a=rnd(1,b-1);}while(gcd(a,b)!==1);
    const k=pick([2,3].filter(k=>b*k<=12));
    const ok={n:a*k,d:b*k,ok:true},t=[a,b];
    const seen=new Set([ok.n+'/'+ok.d,a+'/'+b]);
    const traps=shuffle([{n:a+1,d:b+1,t:'addSame'},{n:b,d:a,t:'flip'},{n:a,d:b*k,t:'oneSide'},{n:a*k,d:b,t:'oneSide'},{n:a+k,d:b+k,t:'addSame'},{n:a*k+1,d:b*k,t:'oneSide'}])
      .filter(x=>{const kk=x.n+'/'+x.d;if(seen.has(kk)||x.d>12||sameV([x.n,x.d],t))return false;seen.add(kk);return true;}).slice(0,3);
    return{target:{n:a,d:b},opts:shuffle([ok,...traps])};
  }
  function combo(){
    let p,b,q,d,sum;
    do{b=pick([2,3,4]);d=pick([4,6,8,12].filter(x=>x%b===0&&x!==b));p=rnd(1,b-1);q=rnd(1,d-1);sum=p*120/b+q*120/d;}while(sum>=120||gcd(p,b)!==1||gcd(q,d)!==1);
    const g=gcd(sum,120),target={n:sum/g,d:120/g};
    const pieces=[{n:p,d:b},{n:q,d:d}],seen=new Set(pieces.map(x=>x.n+'/'+x.d));
    let guard=0;while(pieces.length<5&&guard++<200){const dd=pick([2,3,4,6,8,12]),nn=rnd(1,dd-1);const kk=nn+'/'+dd;
      if(gcd(nn,dd)===1&&!seen.has(kk)&&!sameV([nn,dd],[target.n,target.d])){seen.add(kk);pieces.push({n:nn,d:dd});}}
    return{target,pieces:shuffle(pieces),sol:[{n:p,d:b},{n:q,d:d}]};
  }
  function show(){
    let locked=false;api.prog(i,N);api.clear();stage.innerHTML='';
    const it=build?combo():single();
    const w=h(`<div><div class="arena"><div class="alien">👾</div><div class="laser"></div><div class="me">🚀</div></div>
      <div class="paper prompt">${build?'Build a shield that is <b>exactly</b>':'Pick the shield piece equal to'}<div class="target">${frHTML(it.target.n,it.target.d)}</div>${build?'<div class="rule">Tap a piece to add it. You can use a piece more than once! Tap your shield bar to take a piece off.</div>':''}</div>
      <div class="bars"><div class="barrow"><span class="bl">Goal</span><div class="track"><div class="seg goal" style="width:${pct(it.target)}%"></div></div></div>
      <div class="barrow"><span class="bl">Shield</span><div class="track mine"></div></div></div>
      <div class="tiles pieces"></div>${build?'<div class="row"><button class="btn gold raise">🛡️ Raise shield</button></div>':''}</div>`);
    const mine=w.querySelector('.mine'),tiles=w.querySelector('.tiles'),arena=w.querySelector('.arena');
    const cols=['#22D3EE','#FFD93D','#FF5ACD','#7CFBB2','#FF8A3D'];
    const drawMine=(list,rm)=>{mine.innerHTML='';list.forEach((f,k)=>{const sg=h(`<div class="seg ${rm?'rm':''}" style="width:${pct(f)}%;background:${cols[k%cols.length]}">${f.n}/${f.d}</div>`);if(rm)sg.onclick=()=>{if(locked)return;list.splice(k,1);drawMine(list,true);};mine.append(sg);});};
    function win(){locked=true;arena.classList.add('blocked');api.coach('Blocked! Your shield is the perfect size.','good');burstAt(arena);
      api.later(()=>{i++;i<N?show():api.finish();},1800);}
    if(!build){
      it.opts.forEach(o=>{const b=h(`<button class="tile">${frHTML(o.n,o.d)}</button>`);
        b.onclick=()=>{if(locked)return;drawMine([o]);
          if(o.ok)win();
          else{b.classList.add('used');const s=v120(o)<v120(it.target)?'That shield is too short. The laser would slip past! ':'That shield is too long. It won’t fit! ';api.coach(s+FRAC_TIPS[o.t]);}};
        tiles.append(b);});
    }else{
      const sel=[];w.clearShield=()=>{sel.length=0;drawMine(sel,true);};
      it.pieces.forEach(o=>{const b=h(`<button class="tile">${frHTML(o.n,o.d)}</button>`);
        b.onclick=()=>{if(locked)return;sel.push(o);drawMine(sel,true);};
        tiles.append(b);});
      w.querySelector('.raise').onclick=()=>{if(locked)return;
        if(!sel.length){api.coach('Tap pieces to build your shield first!','info');return;}
        const tot=sel.reduce((s,f)=>s+v120(f),0),goal=v120(it.target);
        if(tot===goal)win();
        else if(tot>goal)api.coach('Too long! Your shield is bigger than the goal. Take a piece off.');
        else api.coach('Not long enough yet. Try renaming the pieces so they have the same denominator, like 1/2 = 2/4.');};
    }
    if(!build){const ok=it.opts.find(o=>o.ok),k=ok.n/it.target.n;
      api.answer(`${ok.n}/${ok.d} is equal to ${it.target.n}/${it.target.d}. Multiply the top and the bottom by ${k}: ${it.target.n} × ${k} = ${ok.n} and ${it.target.d} × ${k} = ${ok.d}.`,
        ()=>{const b=[...tiles.querySelectorAll('.tile')][it.opts.indexOf(ok)];if(b)b.click();});}
    else{const [A,B]=it.sol,D=B.d,an=A.n*D/A.d,sum=an+B.n;
      api.answer(`${A.n}/${A.d} + ${B.n}/${B.d} makes the shield. Rename with the same denominator: ${an}/${D} + ${B.n}/${D} = ${sum}/${D}${sum/D===it.target.n/it.target.d&&(sum!==it.target.n||D!==it.target.d)?`, and ${sum}/${D} = ${it.target.n}/${it.target.d}`:''}.`,
        ()=>{const sel=[];/* rebuild from the real pieces so tapping still works */const pA=it.pieces.find(x=>x.n===A.n&&x.d===A.d),pB=it.pieces.find(x=>x.n===B.n&&x.d===B.d);
          const t=[...tiles.querySelectorAll('.tile')];w.clearShield();t[it.pieces.indexOf(pA)].click();t[it.pieces.indexOf(pB)].click();w.querySelector('.raise').click();});}
    stage.append(w);
  }
  show();
};

/* ---------- Feeding Frenzy (Gr 2) ---------- */
function tenBlocks(n){const H=Math.floor(n/100),T=Math.floor(n/10)%10,O=n%10;let s='<div class="b10">';
  for(let k=0;k<H;k++)s+='<i class="hund"></i>';s+='<span class="brk"></span>';
  for(let k=0;k<T;k++)s+='<i class="ten"></i>';for(let k=0;k<O;k++)s+='<i class="one"></i>';return s+'</div>';}
function gatorSVG(){return`<svg viewBox="0 0 120 100" width="120" height="100" class="gsvg" aria-hidden="true">
  <g class="jaw-up"><path d="M18 50 L108 14" stroke="#3FBF6F" stroke-width="20" stroke-linecap="round"/><path d="M40 50 L102 26" stroke="#fff" stroke-width="6" stroke-dasharray="4 7"/></g>
  <g class="jaw-dn"><path d="M18 50 L108 86" stroke="#3FBF6F" stroke-width="20" stroke-linecap="round"/><path d="M40 50 L102 74" stroke="#fff" stroke-width="6" stroke-dasharray="4 7"/></g>
  <circle cx="24" cy="36" r="9" fill="#fff"/><circle cx="26" cy="36" r="4.5" fill="#0B1026"/></svg>`;}
function cmpWhy(a,b){if(a===b)return`${a} and ${b} have the same digits in every place, so they are equal.`;
  const big=Math.max(a,b),sm=Math.min(a,b),sb=String(big),ss=String(sm);
  if(sb.length!==ss.length)return`${big} has more digits than ${sm}, so ${big} is greater.`;
  const names=['thousands','hundreds','tens','ones'].slice(4-sb.length);
  for(let k=0;k<sb.length;k++)if(sb[k]!==ss[k])return`${k?`The ${names.slice(0,k).join(' and ')} are the same. `:''}Look at the ${names[k]}: ${sb[k]} ${names[k]} is more than ${ss[k]} ${names[k]}. So ${big} is greater than ${sm}.`;}
function placeHint(a,b){
  if(a===b)return'Look again! These numbers have the same digit in every place. That means they are equal.';
  const sa=String(a),sb=String(b);
  if(sa.length!==sb.length)return'Count the digits! A number with more digits is bigger.';
  const names=['thousands','hundreds','tens','ones'].slice(4-sa.length);
  for(let k=0;k<sa.length;k++)if(sa[k]!==sb[k])return k===0?`Start with the biggest place, the ${names[0]}. Which meal has more ${names[0]}?`:`Both have the same ${names[k-1]}. Now look at the ${names[k]} place!`;
}
GAMES.gator=function(stage,level,api){
  const lv=level==null?rnd(0,4):level,pics=lv<=1,FOOD=['🐟','🍗','🥩','🍖','🦐','🍉'];
  const items=[];
  for(let k=0;k<3;k++){let a,b;
    if(lv<=1){a=rnd(100,999);do{b=rnd(100,999);}while(b===a);if(Math.random()<.5)b=Math.floor(a/100)*100+rnd(0,99)||b;if(b===a)b=a+rnd(1,9);}
    else if(Math.random()<.15){a=b=rnd(100,1200);}
    else{a=rnd(100,1200);const t=Math.floor(a/10)%10,o=a%10;
      if(Math.random()<.5&&t!==o)b=a-t*10-o+o*10+t;else{do{b=Math.floor(a/100)*100+rnd(0,99);}while(b===a);}}
    items.push([a,b]);}
  let i=0;
  function show(){
    const [a,b]=items[i];let locked=false;api.prog(i,items.length);api.clear();stage.innerHTML='';
    const food=pick(FOOD);
    const crate=(n,cls)=>`<button class="crate ${cls}"><div class="food">${food}${food}${food}</div><div class="num">${n.toLocaleString()}</div>${pics&&n<1000?tenBlocks(n):''}</button>`;
    const w=h(`<div><div class="paper prompt">The gator wants the BIGGER meal! Tap the meal it should eat.</div>
      <div class="pond">${crate(a,'L')}<div class="gator closed">${gatorSVG()}</div>${crate(b,'R')}</div>
      <div class="row"><button class="btn ghost eq">= They’re equal</button></div><div class="sentence"></div></div>`);
    const gator=w.querySelector('.gator'),sentence=w.querySelector('.sentence');
    const right=a>b?'L':a<b?'R':'E';
    const pose=s=>{gator.classList.remove('left','closed','chomp');if(s==='L')gator.classList.add('left');if(s==='E')gator.classList.add('closed');};
    function choose(s){if(locked)return;pose(s);
      if(s===right){locked=true;const sym=s==='L'?'>':s==='R'?'<':'=';
        sentence.textContent=`${a.toLocaleString()} ${sym} ${b.toLocaleString()}`;
        void gator.offsetWidth;gator.classList.add('chomp');
        api.coach(s==='E'?`${a} is equal to ${b}. Share the meal!`:`Chomp! ${Math.max(a,b)} is greater than ${Math.min(a,b)}.`,'good');burstAt(sentence);
        api.later(()=>{i++;i<items.length?show():api.finish();},1900);}
      else{api.coach(placeHint(a,b));setTimeout(()=>{if(!locked)pose('E');},900);}}
    w.querySelector('.L').onclick=()=>choose('L');w.querySelector('.R').onclick=()=>choose('R');w.querySelector('.eq').onclick=()=>choose('E');
    api.answer(cmpWhy(a,b),()=>choose(right));
    stage.append(w);kidSay(`The gator wants the bigger meal. ${a} or ${b}?`);
  }
  show();
};

/* ---------- Leap Frog (Gr 2) ---------- */
function frogShape(){return`<g class="fbody"><ellipse cx="-12" cy="9" rx="9" ry="5" fill="#2E9E58"/><ellipse cx="0" cy="3" rx="15" ry="10" fill="#3FBF6F"/><circle cx="10" cy="-6" r="7" fill="#3FBF6F"/><circle cx="11" cy="-9" r="3.6" fill="#fff"/><circle cx="12.4" cy="-9" r="1.8" fill="#0B1026"/><path d="M13 -1 q4 2 7 -1" stroke="#0B1026" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;}
GAMES.frog=function(stage,level,api){
  const lv=level==null?rnd(0,4):level;
  const steps=lv>=2?[1,10,100]:[1,10],types=lv>=2?shuffle(['hop','howmany','find']):shuffle(['find','find','howmany']);
  const unit={1:'ones',10:'tens',100:'hundreds'};
  function gen(t){const step=pick(steps),start=step===1?10*rnd(0,98):step===10?100*rnd(0,9):0;
    if(t==='find')return{t,step,start,from:0,idx:rnd(1,9),labels:[0,10]};
    const from=rnd(1,8),k=rnd(2,4);let dir=Math.random()<.5?-1:1;if(from+dir*k<0||from+dir*k>10)dir=-dir;
    return{t,step,start,from,k,dir,idx:from+dir*k,labels:t==='howmany'?[0,10,from,from+dir*k]:[0,10,from]};}
  const items=types.map(gen);let i=0;
  const X=k=>20+k*32;
  function show(){
    const it=items[i],val=k=>it.start+k*it.step;let locked=false,pos=it.from,busy=false;api.prog(i,items.length);api.clear();stage.innerHTML='';
    let pads='';for(let k=0;k<=10;k++)pads+=`<g class="pad" data-k="${k}" style="cursor:pointer"><rect x="${X(k)-16}" y="20" width="32" height="90" fill="transparent"/><ellipse cx="${X(k)}" cy="72" rx="13" ry="6" fill="#3FBF6F" opacity=".75"/><line x1="${X(k)}" y1="78" x2="${X(k)}" y2="86" stroke="#B7BEE6" stroke-width="2"/>
      <text class="lbl" x="${X(k)}" y="104" text-anchor="middle" font-size="12" font-family="Nunito" font-weight="800" fill="#F5F8FF" ${it.labels.includes(k)?'':'visibility="hidden"'}>${val(k)}</text></g>`;
    const verb=it.dir>0?'forward':'back',U=unit[it.step];
    const prompt=it.t==='find'?`Hop to <b>${val(it.idx)}</b>! Tap the lily pad.`
      :it.t==='hop'?`The frog is on <b>${val(it.from)}</b>. Hop ${verb} ${it.k} ${U}. Tap where it will land!`
      :`The frog is on <b>${val(it.from)}</b>. How many should we ${it.dir>0?'add':'take away'} to get to <b>${val(it.idx)}</b>?`;
    const w=h(`<div><div class="paper prompt"><div class="chip">Counting by ${it.step}s</div><div style="display:flex;align-items:center;justify-content:center;gap:10px"><span class="ptxt">${prompt}</span><button class="speak" aria-label="Read aloud">🔊</button></div></div>
      <svg class="frogsvg" viewBox="0 0 360 115"><rect x="0" y="58" width="360" height="28" rx="14" fill="#2D3B78"/><line x1="10" y1="82" x2="350" y2="82" stroke="#B7BEE6" stroke-width="2"/>${pads}<g class="pops"></g>
      <g class="frog" style="transform:translate(${X(it.from)}px,58px)"><g class="fdir">${frogShape()}</g></g></svg><div class="opts"></div></div>`);
    const frog=w.querySelector('.frog'),fdir=w.querySelector('.fdir'),pops=w.querySelector('.pops'),svg=w.querySelector('svg');
    const sayP=()=>say(`Counting by ${it.step}s. `+w.querySelector('.ptxt').textContent);
    w.querySelector('.speak').onclick=sayP;
    const place=k=>{pos=k;frog.style.transform=`translate(${X(k)}px,58px)`;};
    function hopTo(to,done,showPop){busy=true;const d=Math.sign(to-pos);if(d)fdir.setAttribute('transform',d<0?'scale(-1,1)':'');
      (function step(){if(pos===to){busy=false;done&&done();return;}
        place(pos+d);frog.classList.remove('hop');void frog.getBoundingClientRect();frog.classList.add('hop');
        if(showPop){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',X(pos));t.setAttribute('y',40);t.setAttribute('text-anchor','middle');t.setAttribute('class','hpop');t.textContent=(d>0?'+':'−')+it.step;pops.append(t);}
        setTimeout(step,360);})();}
    const win=msg=>{locked=true;api.coach(msg,'good');burstAt(frog);api.later(()=>{i++;i<items.length?show():api.finish();},1500);};
    if(it.t==='howmany'){
      const k=it.k,ans=k*it.step,cand=[...new Set([ans,k,k*it.step*10,(k+1)*it.step,it.step===1?k*10:Math.max(1,k*it.step/10)])].filter(x=>x>0);
      const opts=shuffle([ans,...shuffle(cand.filter(x=>x!==ans)).slice(0,2)]);
      opts.forEach(o=>{const b=h(`<button class="tile sm">${o}</button>`);
        b.onclick=()=>{if(locked||busy)return;
          if(o===ans){locked=true;hopTo(it.idx,()=>win(`Yes! ${val(it.from)} ${it.dir>0?'+':'−'} ${ans} = ${val(it.idx)}.`),true);}
          else{b.classList.add('used');api.coach(o===k&&it.step!==1?`${k} is how many HOPS! But each hop is worth ${it.step}. How much is that altogether?`:`Count the hops from ${val(it.from)} to ${val(it.idx)}. Each hop is ${it.step}.`);}};
        w.querySelector('.opts').append(b);});
    }else{
      svg.querySelectorAll('.pad').forEach(p=>p.addEventListener('click',()=>{if(locked||busy)return;const k=+p.dataset.k,start=pos;
        hopTo(k,()=>{
          if(k===it.idx){p.querySelector('.lbl').setAttribute('visibility','visible');win(`Ribbit! ${val(k)}!`);}
          else{api.coach(it.t==='find'?`Count by ${it.step}s from ${val(0)}: ${val(0)}, ${val(1)}, ${val(2)}… Which pad is ${val(it.idx)}?`:`Each lily pad is ${it.step} more. Start at ${val(it.from)} and hop ${it.k} pads ${verb}.`);
            setTimeout(()=>{if(!locked){fdir.setAttribute('transform','');frog.style.transition='none';place(it.t==='find'?0:it.from);frog.getBoundingClientRect();frog.style.transition='';}},700);}
        },false);}));
    }
    {const seq=[];for(let k=1;k<=it.k;k++)seq.push(val(it.from+it.dir*k));
     const txt=it.t==='find'?`Count by ${it.step}s from ${val(0)}: ${val(0)}, ${val(1)}, ${val(2)}… ${val(it.idx)} is ${it.idx} hop${it.idx>1?'s':''} from ${val(0)}.`
      :it.t==='hop'?`Start at ${val(it.from)} and hop ${it.k} ${U} ${verb}: ${seq.join(', ')}. The frog lands on ${val(it.idx)}.`
      :`From ${val(it.from)} to ${val(it.idx)} is ${it.k} hops, and each hop is ${it.step}. ${it.k} hops of ${it.step} is ${it.k*it.step}.`;
     api.answer(txt,()=>{if(it.t==='howmany'){const b=[...w.querySelectorAll('.opts button')].find(q=>+q.textContent===it.k*it.step);if(b)b.click();}
       else{const pd=svg.querySelector(`.pad[data-k="${it.idx}"]`);if(pd)pd.dispatchEvent(new Event('click'));}});}
    stage.append(w);if(P.grade===2)sayP();
  }
  show();
};

function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let prev=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;}}return m[b.length];}

GAMES.chase=function(stage,level,api){
  const lv=level==null?rnd(0,4):level,g5=P.grade===5,N=10;
  function gen(){
    if(!g5){if(lv>=2&&Math.random()<.5){const a=rnd(5,20),b=rnd(1,Math.min(10,a));return{q:`${a} − ${b}`,a:a-b,op:'sub',x:a,y:b};}
      const a=rnd(1,10),b=rnd(1,10);return{q:`${a} + ${b}`,a:a+b,op:'add',x:a,y:b};}
    const m=lv>=2?12:10,a=rnd(2,m),b=rnd(2,m);
    if(lv>=2&&Math.random()<.5)return{q:`${a*b} ÷ ${a}`,a:b,op:'div',x:a*b,y:a};
    return{q:`${a} × ${b}`,a:a*b,op:'mul',x:a,y:b};}
  const tip=p=>p.op==='add'?'Start with the bigger number and count on.':p.op==='sub'?`Think addition: ${p.y} + ? = ${p.x}.`:p.op==='mul'?`Use a fact you know, then add or take away one group of ${p.x}.`:`Think multiplication: ${p.y} × ? = ${p.x}.`;

      <p style="font-weight:700;text-align:center;margin:6px 0 0">Answer ${N} ${g5?'facts':'problems'} to reach the planet. Right answers blast you ahead. Tap the number buttons <b>or</b> type on your keyboard. Your answer checks itself when it’s long enough.</p>
      <div class="row"><button class="btn gold big go">▶ START</button></div></div></div></div>`);
  stage.append(w);

  let done=0,cur=gen(),typed='',hp=4,over=true,t0=0,iv=null;

  function paint(){run.style.left=runPct()+'%';hole.style.left=hp+'%';qEl.textContent=cur.q;aEl.textContent=typed||'?';}
  function press(d){if(over)return;if(d==='⌫'){typed=typed.slice(0,-1);paint();return;}
    if(typed.length>=3)return;typed+=d;paint();
    if(typed.length===String(cur.a).length){
      if(+typed===cur.a){done++;typed='';api.clear();api.tick();if(done>=N){finishRun();return;}cur=gen();paint();}
      else{hp=Math.min(hp+7,runPct()-5);track.classList.remove('hit');void track.offsetWidth;track.classList.add('hit');cur.m=(cur.m||0)+1;
        if(cur.m>=2){api.coach(`${cur.q} = ${cur.a}. Remember that one! Here’s a new problem.`);bump('chase','r');api.tick();typed='';cur=gen();setTimeout(paint,250);}
        else{api.coach(tip(cur));typed='';setTimeout(paint,250);}}}}
  ['1','2','3','4','5','6','7','8','9','⌫','0'].forEach(k=>{const b=h(`<button class="key">${k}</button>`);b.onclick=()=>press(k);w.querySelector('.pad').append(b);});
  const onKey=e=>{if(!stage.isConnected){document.removeEventListener('keydown',onKey);return;}if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');};
  document.addEventListener('keydown',onKey);
  w.querySelector('.go').onclick=()=>{cs.innerHTML='<div class="count">3</div>';let n=3;kidSay('3');
    const ci=setInterval(()=>{if(!stage.isConnected){clearInterval(ci);return;}n--;
      if(n>0){cs.innerHTML=`<div class="count">${n}</div>`;kidSay(String(n));}
      else{clearInterval(ci);cs.innerHTML='<div class="count">GO!</div>';setTimeout(()=>cs.remove(),450);
        over=false;t0=performance.now();paint();
        iv=setInterval(()=>{if(!stage.isConnected||over){clearInterval(iv);return;}hp=Math.min(hp+.12,runPct()-9);hole.style.left=hp+'%';tEl.textContent=((performance.now()-t0)/1000).toFixed(1)+'s';},100);}},800);};
  function finishRun(){over=true;clearInterval(iv);document.removeEventListener('keydown',onKey);paint();
    const t=(performance.now()-t0)/1000;P.best=P.best||{};const key='chase'+(g5?'5':'2'),best=P.best[key],rec=!best||t<best;

/* ---------- Star Navigator routes (Gr 5, levels 2–3) ---------- */
function navRoute(stage,lv,api){
  const N=10,L=34,C=28,T=16,px=x=>L+x*C,py=y=>T+(N-y)*C,key=p=>p.x+','+p.y;
  const labeled=lv<4,R=2;let ri=0;
  function segPts(a,b){const out=[];const dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y);let x=a.x,y=a.y;out.push({x,y});while(x!==b.x||y!==b.y){x+=dx;y+=dy;out.push({x,y});}return out;}
  function gen(){
    let wps;
    if(lv>=4){const a=rnd(1,4),b=rnd(6,9),c=rnd(3,7);wps=Math.random()<.5?[{x:a,y:0},{x:a,y:c},{x:b,y:c},{x:b,y:10}]:[{x:0,y:a},{x:c,y:a},{x:c,y:b},{x:10,y:b}];}
    else{const a=rnd(2,8),b=rnd(2,8);wps=Math.random()<.5?[{x:a,y:0},{x:a,y:b},{x:10,y:b}]:[{x:0,y:a},{x:b,y:a},{x:b,y:10}];}
    const full=[{x:0,y:0},...wps,{x:10,y:10}],safe=new Set();
    for(let k=0;k<full.length-1;k++)segPts(full[k],full[k+1]).forEach(p=>safe.add(key(p)));
    const rocks=new Map(),add=p=>{const k=key(p);if(!safe.has(k)&&!rocks.has(k))rocks.set(k,p);};
    const edge=f=>{const o=[];for(let t=1;t<=9;t++){const p=f(t);if(!safe.has(key(p)))o.push(p);}if(o.length)add(pick(o));};
    edge(t=>({x:0,y:t}));edge(t=>({x:t,y:0}));edge(t=>({x:10,y:t}));edge(t=>({x:t,y:10}));
    let g=0;while(rocks.size<(lv>=4?18:14)&&g++<600)add({x:rnd(0,10),y:rnd(0,10)});
    return{wps,rocks:[...rocks.values()],safe};
  }
  function show(){
    const pz=gen(),rockKeys=new Set(pz.rocks.map(key));let locked=false;api.prog(ri,R);api.clear();stage.innerHTML='';
    const decoys=[];if(labeled){let g=0;while(decoys.length<3&&g++<400){const p={x:rnd(1,9),y:rnd(1,9)};if(!rockKeys.has(key(p))&&!pz.safe.has(key(p))&&!decoys.some(d=>key(d)===key(p)))decoys.push(p);}}
    const marks=labeled?shuffle([...pz.wps,...decoys]).map((p,k)=>({...p,lab:'ABCDEFGH'[k]})):[];
    let grid='';
    for(let k=0;k<=N;k++){grid+=`<line x1="${px(k)}" y1="${py(0)}" x2="${px(k)}" y2="${py(N)}" stroke="${k?'#2D3768':'#B7BEE6'}" stroke-width="${k?1:2.5}"/><line x1="${px(0)}" y1="${py(k)}" x2="${px(N)}" y2="${py(k)}" stroke="${k?'#2D3768':'#B7BEE6'}" stroke-width="${k?1:2.5}"/>
      <text x="${px(k)}" y="${py(0)+17}" text-anchor="middle" font-size="11" fill="#B7BEE6" font-family="Nunito" font-weight="700">${k}</text>${k?`<text x="${px(0)-9}" y="${py(k)+4}" text-anchor="end" font-size="11" fill="#B7BEE6" font-family="Nunito" font-weight="700">${k}</text>`:''}`;}
    const rocksSVG=pz.rocks.map(r=>`<g transform="translate(${px(r.x)} ${py(r.y)})"><circle r="10" fill="#5b6390"/><circle cx="-3" cy="-2" r="2.6" fill="#434a73"/><circle cx="3" cy="3" r="2" fill="#434a73"/></g>`).join('');
    const marksSVG=marks.map(m=>`<g transform="translate(${px(m.x)} ${py(m.y)})"><circle r="10" fill="#FFD93D"/><text text-anchor="middle" dominant-baseline="central" font-size="12" font-family="Nunito" font-weight="800" fill="#0B1026">${m.lab}</text></g>`).join('');
    const w=h(`<div><div class="paper prompt">${labeled?'Plot a course from <b>(0, 0)</b> to the 🏁 at <b>(10, 10)</b>. Use the lettered stars as waypoints and enter their ordered pairs.':'No stars to guide you this time! Plot your own course to the 🏁 at <b>(10, 10)</b>, dodging every asteroid.'}
      <div class="rule">Ships only fly straight across or straight up and down. Fewer waypoints earns a bonus star!</div></div>
      <div class="navwrap"><svg class="nav" viewBox="0 0 330 334" style="cursor:default"><rect x="${px(0)}" y="${py(N)}" width="${N*C}" height="${N*C}" fill="#0B1026"/>${grid}${rocksSVG}${marksSVG}
       <text x="${px(10)}" y="${py(10)}" font-size="20" text-anchor="middle" dominant-baseline="central">🏁</text><g class="wpm"></g>
       <g class="ship" style="transform:translate(${px(0)}px,${py(0)}px);transition:transform .55s ease-in-out"><text font-size="22" text-anchor="middle" dominant-baseline="central">🚀</text></g></svg></div>
      <div class="wplist"></div><div class="row"><button class="btn ghost addw">+ Waypoint</button><button class="btn gold launch">🚀 Launch</button></div></div>`);
    stage.append(w);
    const ship=w.querySelector('.ship'),wpm=w.querySelector('.wpm'),list=w.querySelector('.wplist');
    const wp=[{x:null,y:null},{x:null,y:null},{x:null,y:null}];
    const opts=[`<option value="">–</option>`,...Array.from({length:11},(_,k)=>`<option value="${k}">${k}</option>`)].join('');
    function drawMarks(){wpm.innerHTML=wp.map((p,k)=>p.x==null||p.y==null?'':`<g transform="translate(${px(p.x)} ${py(p.y)})"><circle r="7" fill="none" stroke="#22D3EE" stroke-width="2.5"/><text y="-11" text-anchor="middle" font-size="11" font-family="Nunito" font-weight="800" fill="#22D3EE">${k+1}</text></g>`).join('');}
    function drawList(){list.innerHTML='';wp.forEach((p,k)=>{const r=h(`<div class="wprow"><span class="num">${k+1}</span> ( <select aria-label="Waypoint ${k+1} x">${opts}</select> , <select aria-label="Waypoint ${k+1} y">${opts}</select> )${wp.length>1?'<button class="x" aria-label="Remove waypoint">✕</button>':''}</div>`);

      const x=r.querySelector('.x');if(x)x.onclick=()=>{if(locked)return;wp.splice(k,1);drawList();drawMarks();};list.append(r);});}
    w.querySelector('.addw').onclick=()=>{if(locked||wp.length>=5)return;wp.push({x:null,y:null});drawList();};
    const place=(p,instant)=>{if(instant){ship.style.transition='none';ship.getBoundingClientRect();}ship.style.transform=`translate(${px(p.x)}px,${py(p.y)}px)`;if(instant)requestAnimationFrame(()=>ship.style.transition='transform .55s ease-in-out');};
    w.querySelector('.launch').onclick=()=>{if(locked)return;
      if(wp.some(p=>p.x==null||p.y==null)){api.coach('Fill in both numbers for every waypoint, or remove the extra one.','info');return;}
      locked=true;api.clear();place({x:0,y:0},true);
      const path=[{x:0,y:0},...wp.map(p=>({x:p.x,y:p.y})),{x:10,y:10}];let k=0;
      const nm=(j,p)=>j===0?'the start (0, 0)':j===path.length-1?'the finish (10, 10)':`waypoint ${j} (${p.x}, ${p.y})`;
      const reset=msg=>{api.coach(msg);setTimeout(()=>{place({x:0,y:0});locked=false;},900);};
      (function step(){
        if(k===path.length-1){
          const bonus=wp.length<=pz.wps.length;api.coach(`You made it!${bonus?' ⭐ Bonus star for a super-efficient route!':''}`,'good');burstAt(ship);
          api.later(()=>{ri++;ri<R?show():api.finish();},2200);return;}
        const a=path[k],b=path[k+1];
        if(a.x!==b.x&&a.y!==b.y){reset(`The ship can’t fly from ${nm(k,a)} to ${nm(k+1,b)}. That’s diagonal! To fly straight, the x or the y has to stay the same.`);return;}
        const pts=segPts(a,b),hit=pts.findIndex(p=>rockKeys.has(key(p)));
        if(hit>=0){if(hit>0)place(pts[hit-1]);setTimeout(()=>reset(`Shields held! An asteroid blocks the path from ${nm(k,a)} to ${nm(k+1,b)}. Try a new route.`),600);return;}
        place(b);k++;setTimeout(step,650);})();
    };
    api.answer(`One route that works: (0, 0) → ${pz.wps.map(p=>`(${p.x}, ${p.y})`).join(' → ')} → (10, 10). Each step keeps x or y the same, so the ship flies straight and misses every asteroid.`,
      ()=>{wp.splice(0,wp.length,...pz.wps.map(p=>({x:p.x,y:p.y})));drawList();drawMarks();setTimeout(()=>{locked=false;w.querySelector('.launch').click();},350);});
    drawList();
  }
  show();
}

  show();

    const capW=words.map(x=>x[0]!==x[0].toLowerCase()),state=words.map(()=>false);let mark=null;
    const w=h(`<div><div class="paper"><div class="prompt" style="margin-bottom:10px">🔧 Fix the sentence! Tap words that need a capital letter, then pick the end mark.</div><div class="fixrow"></div></div>
      <div class="row ends"></div><div class="row"><button class="btn gold go">Check</button></div></div>`);
    const row=w.querySelector('.fixrow');
    const cap=(x,on)=>on?x[0].toUpperCase()+x.slice(1):x.toLowerCase();
    const endEl=h(`<span class="fixend">?</span>`);
    words.forEach((x,k)=>{const b=h(`<button class="fixw">${cap(x,false)}</button>`);b.onclick=()=>{if(locked)return;state[k]=!state[k];b.textContent=cap(x,state[k]);b.classList.toggle('on',state[k]);};row.append(b);});

      if(state.some((on,k)=>on&&!capW[k]))return api.coach('Oops, one word has a capital it doesn’t need. Only the first word, names, and I get capitals here.');

    {const cw=words.filter((x,k)=>capW[k]).map(x=>x.replace(/[^A-Za-z’']/g,''));const why=end==='?'?'it asks something':end==='!'?'it shows a big feeling':'it tells something';
     api.answer(`Capitals go on: ${cw.join(', ')}. It ends with “${end}” because ${why}.`,

         const m=[...w.querySelectorAll('.endm')].find(b=>b.textContent===end);if(m)m.click();w.querySelector('.go').click();});}

};

const PP2=[['🗄️','Opening a drawer','pull'],['⚽','Kicking a ball','push'],['🧒','Pulling a wagon','pull'],['🛝','Pushing a friend on a swing','push'],['🛒','Rolling a shopping cart away from you','push'],['🪢','Tug of war','pull'],['🚪','Closing a door','push'],['🍎','Picking an apple off a tree','pull']];
GAMES.bowl=function(stage,level,api){
  const lv=level==null?rnd(0,4):level;
  const items=level==null?shuffle(['target','strike','squish','pp']).slice(0,3):lv<=1?['target','squish','pp']:['target','strike','squish'];
  let i=0;const next=(ms=2000)=>api.later(()=>{i++;i<items.length?show():api.finish();},ms);
  const laneSVG=extra=>`<svg class="lane2" viewBox="0 0 400 150"><rect x="0" y="40" width="400" height="70" rx="12" fill="#C98B4B"/><rect x="60" y="40" width="100" height="70" fill="#7CFBB2" opacity=".12" class="zone znear"/><rect x="160" y="40" width="100" height="70" fill="#FFD93D" opacity=".12" class="zone zmid"/><rect x="260" y="40" width="110" height="70" fill="#FF5ACD" opacity=".12" class="zone zfar"/>

    <g class="ball" style="transform:translate(32px,75px)"><circle r="16" fill="#6832F6" stroke="#fff" stroke-width="2"/><circle cx="-5" cy="-5" r="3" fill="#fff"/><circle cx="4" cy="-7" r="3" fill="#fff"/><circle cx="6" cy="2" r="3" fill="#fff"/></g>
    <g class="meter"><rect x="10" y="118" width="380" height="18" rx="9" fill="#1C2444" stroke="#2D3768"/><rect class="mfill" x="10" y="118" width="0" height="18" rx="9" fill="#FFD93D"/><text x="25" y="146" font-size="11" font-weight="800" font-family="Nunito" fill="#B7BEE6">gentle</text><text x="200" y="146" text-anchor="middle" font-size="11" font-weight="800" font-family="Nunito" fill="#B7BEE6">medium</text><text x="375" y="146" text-anchor="end" font-size="11" font-weight="800" font-family="Nunito" fill="#B7BEE6">STRONG</text></g></svg>`;
  function arm(w,onLaunch){const ball=w.querySelector('.ball'),mf=w.querySelector('.mfill'),svg=w.querySelector('.lane2');let p=0,hold=false,raf;
    const tick=()=>{if(!hold)return;p=Math.min(1,p+.012);mf.setAttribute('width',380*p);ball.style.transform=`translate(${32-p*6}px,75px) scale(${1+p*.15})`;raf=requestAnimationFrame(tick);};
    const down=e=>{if(w.locked)return;e.preventDefault();hold=true;p=0;tick();};
    const up=()=>{if(!hold)return;hold=false;cancelAnimationFrame(raf);const pw=p;const x=60+pw*300;ball.style.transition=`transform ${500+pw*600}ms cubic-bezier(.15,.7,.3,1)`;ball.style.transform=`translate(${x}px,75px)`;setTimeout(()=>onLaunch(pw,x),550+pw*600);};
    svg.addEventListener('pointerdown',down);svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);svg.addEventListener('pointerleave',up);
    w.reset=()=>{p=0;mf.setAttribute('width',0);ball.style.transition='none';ball.style.transform='translate(32px,75px)';ball.getBoundingClientRect();ball.style.transition='';};}
  function show(){api.prog(i,items.length);api.clear();stage.innerHTML='';const t=items[i];
    if(t==='pp'){let locked=false;const [e,s,ans]=pick(PP2);const w=h(`<div><div class="paper wcard"><div class="em">${e}</div><div class="ctxs" style="text-align:center"></div></div><div class="row"><button class="btn gold big push">👐 Push (away)</button><button class="btn big pull">🫳 Pull (toward)</button></div></div>`);
      w.querySelector('.ctxs').textContent=s;stage.append(w);kidSay(s+'. Is it a push or a pull?');
      const go=v=>{if(locked)return;if(v===ans){locked=true;api.coach(ans==='push'?'Yes! A push moves something away from you.':'Yes! A pull moves something toward you.','good');next();}else api.coach('Is your hand moving the object away from you, or toward you?');};
      w.querySelector('.push').onclick=()=>go('push');w.querySelector('.pull').onclick=()=>go('pull');return;}
    if(t==='target'){const z=rnd(0,2),zn=['near','middle','far'][z];let bm=0;const w=h(`<div><div class="paper prompt">Make the ball stop in the <b>${zn.toUpperCase()}</b> zone!<div class="rule">Press and HOLD the ball to power up. Let go to push!</div></div>${laneSVG()}</div>`);
      w.querySelector('.z'+zn.replace('middle','mid')).setAttribute('opacity','.45');stage.append(w);kidSay(`Make the ball stop in the ${zn} zone. Press and hold the ball to power up. Let go to push!`);
      arm(w,(pw,x)=>{const got=x<160?0:x<260?1:2;if(got===z){w.locked=true;api.coach(z===2?'A strong push sends it far!':z===0?'A gentle push moves it just a little.':'A medium push. Just right for the middle!','good');burstAt(w.querySelector('.ball'));next();}
        else{bm++;api.coach(bm>=2?`Here’s the trick for the ${zn} zone: let go when the power bar is ${['less than one-third full','about half full','more than two-thirds full'][z]}.`:got<z?'That push was too gentle. It stopped short! Hold longer for a stronger push.':'Too strong! It zoomed past. Try a shorter hold.',bm>=2?'info':'hint');setTimeout(()=>w.reset(),900);}});return;}
    if(t==='strike'){let pins='';[[330,55],[330,95],[352,45],[352,75],[352,105]].forEach(([x,y],j)=>pins+=`<g class="pin" style="transform:translate(${x}px,${y}px)"><ellipse rx="6" ry="11" fill="#F5F8FF"/><rect x="-6" y="-4" width="12" height="3" fill="#E11D48"/></g>`);
      const w=h(`<div><div class="paper prompt">Knock down ALL the pins!<div class="rule">Hold to power up, then let go.</div></div>${laneSVG(pins)}</div>`);stage.append(w);kidSay('Knock down all the pins! Hold to power up, then let go.');
      arm(w,pw=>{const pins=w.querySelectorAll('.pin');if(pw>=.7){w.locked=true;pins.forEach((p,q)=>{p.style.transition='transform .5s';p.style.transform+=` rotate(${70+q*15}deg)`;});api.coach('STRIKE! A strong push gives the ball enough speed to knock them all down.','good');burstAt(w.querySelector('.ball'));next();}
        else if(pw>=.4){[...pins].slice(0,2).forEach(p=>{p.style.transition='transform .5s';p.style.transform+=' rotate(60deg)';});api.coach('A medium push only tipped a couple. What kind of push would send it faster?');setTimeout(()=>{w.reset();pins.forEach((p,q)=>{p.style.transition='none';p.style.transform=p.style.transform.replace(/ rotate\([^)]*\)/g,'');});},1200);}
        else{api.coach('Too gentle! It didn’t even reach the pins. Hold longer for a stronger push.');setTimeout(()=>w.reset(),900);}
        w.sm=(w.sm||0)+1;if(w.sm>=2&&pw<.7)setTimeout(()=>api.coach('Here’s the trick: hold until the power bar is almost all the way full, then let go.','info'),1000);});return;}
    if(t==='squish'){let ph=0,pw1=null;const w=h(`<div><div class="paper prompt"><span class="sq"></span></div>${laneSVG(`<g class="clay" style="transform:translate(300px,75px)"><circle r="16" fill="#FF8A3D"/></g><g class="rub" style="transform:translate(300px,75px);display:none"><circle r="16" fill="#22D3EE"/></g><text class="lbl" x="300" y="128" text-anchor="middle" font-size="12" font-weight="800" font-family="Nunito" fill="#F5F8FF"></text>`)}</div>`);
      const say_=m=>{w.querySelector('.sq').textContent=m;kidSay(m);};const clay=w.querySelector('.clay'),rub=w.querySelector('.rub'),lbl=w.querySelector('.lbl');lbl.textContent='clay';
      say_('Push the ball into the CLAY ball. What will happen?');stage.append(w);w.querySelector('.meter').style.display='';
      arm(w,(pw,x)=>{if(pw<.35&&ph<3){api.coach('Too gentle to reach it. Hold longer!');setTimeout(()=>w.reset(),800);return;}
        if(ph===0){clay.style.transition='transform .3s';clay.style.transform=`translate(304px,78px) scale(${1+pw*.9},${1-pw*.55})`;api.coach('Squish! The clay changed shape when the ball crashed into it.','info');
          setTimeout(()=>{ph=1;w.reset();clay.style.transition='none';clay.style.transform='translate(300px,75px)';clay.style.display='none';rub.style.display='';lbl.textContent='rubber';say_('Now push the ball into the RUBBER ball. Will it squish too?');},2200);}
        else if(ph===1){rub.style.transition='transform .5s';rub.style.transform='translate(370px,75px)';api.coach('Boing! The rubber ball bounced away and kept its shape.','info');
          setTimeout(()=>{ph=2;w.reset();rub.style.display='none';rub.style.transform='translate(300px,75px)';clay.style.display='';lbl.textContent='clay';say_('Give the clay a GENTLE push, then a STRONG push. Which squishes it more?');},2200);}
        else if(ph===2){pw1=pw;clay.style.transition='transform .3s';clay.style.transform=`translate(304px,78px) scale(${1+pw*.9},${1-pw*.55})`;setTimeout(()=>{ph=3;w.reset();clay.style.transition='none';clay.style.transform='translate(300px,75px)';say_(pw>=.65?'That was a strong one. Now try a GENTLE push.':'That was gentle. Now try a STRONG push!');},1800);}
        else if(ph===3){clay.style.transition='transform .3s';clay.style.transform=`translate(304px,78px) scale(${1+pw*.9},${1-pw*.55})`;w.locked=true;
          setTimeout(()=>{const q=h(`<div class="row opts3"><button class="tile sm">gentle push</button><button class="tile sm">strong push</button></div>`);w.append(q);say_('Which push squished the clay MORE?');
            q.querySelectorAll('button').forEach((b,k)=>b.onclick=()=>{if(k===1){api.coach('Yes! A bigger push changes the shape more.','good');next();}else{b.classList.add('used');api.coach('Look at the clay after each push. Which one flattened it more?');}});},1200);}});return;}
  }
  show();
};

const MQ=[['Which object would a magnet pick up?',['a steel paper clip','aluminum foil','a copper wire','a plastic spoon'],'Magnets pull on iron and steel. Which one is made of steel?'],
 ['How could you separate iron filings from sand?',['use a magnet','pour in water','use a filter','shake it'],'Iron is magnetic. Sand isn’t.'],

 ['A soda can is metal, but a magnet won’t pick it up. Why?',['It is made of aluminum, which isn’t magnetic.','The magnet is too weak for any metal.','Soda cans are made of plastic.','The can is too heavy.'],'Not all metals are magnetic. Which metal are soda cans made of?'],

const JUNK=[['steel nail','🔩',true],['paper clip','📎',true],['iron bolt','⚙️',true],['steel can','🥫',true],['steel scissors','✂️',true],['aluminum can','🥤',false],['copper penny','🪙',false],['gold ring','💍',false],['plastic bottle','🧴',false],['wooden block','🪵',false],['rubber duck','🦆',false],['glass jar','🫙',false]];
GAMES.magnet=function(stage,level,api){
  const lv=level==null?rnd(0,4):level;
  const items=level==null?['pick','sep','q']:lv<=1?['pick','pick','q']:['pick','sep','q'];let i=0;
  const next=(ms=1800)=>api.later(()=>{i++;i<items.length?show():api.finish();},ms);
  function show(){api.prog(i,items.length);api.clear();stage.innerHTML='';const t=items[i];
    if(t==='q'){const q=deal('mq',MQ,1)[0];mcq(stage,api,q[0],q[1],q[1][0],{any:q[2],good:'Correct!'},next);return;}
    if(t==='pick'){const objs=[...shuffle(JUNK.filter(j=>j[2])).slice(0,3),...shuffle(JUNK.filter(j=>!j[2])).slice(0,3)];const order=shuffle(objs);let j=0,wrong=0;
      const w=h(`<div><div class="paper prompt">🧲 The crane magnet is coming down! Will it pick this up?<div class="rule">Predict first, then watch.</div></div><div class="yard"><div class="crane"><div class="cable"></div><div class="mag">🧲</div></div><div class="obj"></div><div class="pile">${objs.map(o=>`<span>${o[1]}</span>`).join('')}</div></div><div class="row"><button class="btn gold y">Yes, it’s magnetic</button><button class="btn n">No, it stays</button></div></div>`);
      const obj=w.querySelector('.obj'),mag=w.querySelector('.mag'),cr=w.querySelector('.crane');
      const stepO=()=>{const o=order[j];obj.innerHTML=`<div class="objic">${o[1]}</div><div class="objn">${o[0]}</div>`;obj.style.transform='';cr.classList.remove('down');w.querySelectorAll('.row .btn').forEach(b=>b.disabled=false);};
      const go=guess=>{const o=order[j];w.querySelectorAll('.row .btn').forEach(b=>b.disabled=true);cr.classList.add('down');
        setTimeout(()=>{if(o[2]){obj.style.transition='transform .6s';obj.style.transform='translateY(-120px)';}else{obj.style.transition='transform .3s';obj.style.transform='translateX(4px)';setTimeout(()=>obj.style.transform='',300);}
          const metal=['aluminum can','copper penny','gold ring'].includes(o[0]);
          if(guess===o[2])api.coach(o[2]?`Yes! The ${o[0]} is made of iron or steel, so it sticks.`:metal?`Right! The ${o[0]} is metal, but it’s NOT magnetic. Only some metals stick.`:`Right! The ${o[0]} isn’t metal at all, so no pull.`,'info');
          else{wrong++;api.coach(o[2]?`Surprise! The ${o[0]} jumped up. It’s steel, and steel has iron in it.`:metal?`Surprise! The ${o[0]} stayed put. It’s a metal, but not all metals are magnetic. Magnets pull on iron, steel, nickel, and cobalt.`:`Surprise! No pull. The ${o[0]} has no iron in it.`);}
          setTimeout(()=>{if(!stage.isConnected)return;j++;if(j<order.length)stepO();else{api.coach('All sorted! Magnetic things have iron or steel in them. Being shiny or metal isn’t enough.','good');next();}},2300);},700);};
      w.querySelector('.y').onclick=()=>go(true);w.querySelector('.n').onclick=()=>go(false);stage.append(w);stepO();return;}
    if(t==='sep'){let ph=0;const w=h(`<div><div class="paper prompt">🧪 Separation Station: a jar of sand, iron filings, and salt got mixed up. Separate them!<div class="sq"></div></div><div class="sepjar"><div class="sj">🫙</div><div class="sjl">sand + iron + salt</div></div><div class="opts"></div></div>`);
      const q=w.querySelector('.sq'),jl=w.querySelector('.sjl'),opts=w.querySelector('.opts');
      const steps=[['Step 1: Get the iron filings out. Which tool?',[['🧲 magnet',true],['🧻 filter',false],['🔥 heat',false]],'Iron is magnetic. Which tool pulls on iron?','sand + salt','The magnet pulls out the iron filings. Iron is magnetic!'],
        ['Step 2: Add water and stir. What happens to the salt?',[['it dissolves',true],['it melts',false],['it floats',false]],'Think about stirring salt into soup. Where does it go?','sand + salty water','The salt dissolves into the water. It’s still there, just mixed in evenly. That’s a solution.'],
        ['Step 3: Pour it through a filter. What stays in the filter?',[['the sand',true],['the salt',false],['the water',false]],'Which part is still solid pieces that are too big to go through?','salty water','The sand stays in the filter. The salty water goes through.'],
        ['Step 4: Heat the salty water until the water is gone. What’s left?',[['the salt',true],['nothing',false],['the sand',false]],'The water evaporates into the air. What can’t evaporate?','salt crystals','The water evaporated and left the salt behind. All three are separated!']];
      const ask=()=>{const [qq,os,tip,jar,done]=steps[ph];q.textContent=qq;opts.innerHTML='';let lk=false;kidSay('');
        shuffle(os).forEach(([lbl,ok])=>{const b=h(`<button class="tile sm">${lbl}</button>`);b.onclick=()=>{if(lk)return;if(ok){lk=true;jl.textContent=jar;api.coach(done,ph===3?'good':'info');burstAt(w.querySelector('.sj'));ph++;if(ph<steps.length)setTimeout(ask,2200);else next(2200);}else{b.classList.add('used');api.coach(tip);}};opts.append(b);});};
      stage.append(w);ask();return;}
  }
  show();
};
